const EXAMS = [
  {id:1, title:"Foundations", subtitle:"Core Concepts & Definitions", desc:"Covers fundamental agentic AI terminology, architecture patterns, the plan-act-evaluate lifecycle, and baseline knowledge across all six domains.", count:57, time:150},
  {id:2, title:"Applied Practice", subtitle:"Configuration & Implementation", desc:"Scenario-heavy exam focused on real-world setup: MCP configuration, copilot-instructions.md authoring, workflow triggers, debugging, and multi-agent design.", count:57, time:150},
  {id:3, title:"Advanced Scenarios", subtitle:"Complex Multi-Step Problems", desc:"The hardest exam. Complex scenarios, multi-select questions, edge cases in multi-agent coordination, compliance guardrails, and post-hoc failure analysis.", count:57, time:150}
];

/* ═══════════════════════════════════════
   STATE
   ═══════════════════════════════════════ */
let state = {
  screen: "select",    // select | exam | results
  mode: "timed",       // timed | review
  examId: null,
  questions: [],        // shuffled questions for current exam
  answers: {},          // {qIndex: selected} — single int or array for ms, or array for ordering
  flags: new Set(),
  currentQ: 0,
  timerSeconds: 0,
  timerInterval: null,
  startTime: null,
  submitted: false,
  reviewQuestions: [],   // after submission, all questions with user answers for review
  showExplanation: {}    // {qIndex: true} for review mode inline
};

const STORAGE_KEY = "gh600_exam_results";
const TIMER_KEY = "gh600_exam_timer";

/* ═══════════════════════════════════════
   UTILITY FUNCTIONS
   ═══════════════════════════════════════ */
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getResults() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch { return []; }
}

function saveResult(result) {
  const results = getResults();
  results.push(result);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(results));
}

function getBestScore(examId) {
  const results = getResults();
  const examResults = results.filter(r => r.examId === examId);
  if (examResults.length === 0) return null;
  return examResults.reduce((best, r) => r.score > best.score ? r : best, examResults[0]);
}

function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return (h > 0 ? String(h).padStart(2,"0") + ":" : "") +
    String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

function el(id) { return document.getElementById(id); }

function show(screenId) {
  el("screen-select").classList.toggle("hidden", screenId !== "select");
  el("screen-exam").classList.toggle("hidden", screenId !== "exam");
  el("screen-results").classList.toggle("hidden", screenId !== "results");
  state.screen = screenId;
}

/* ═══════════════════════════════════════
   EXAM SELECTION SCREEN
   ═══════════════════════════════════════ */
function renderExamCards() {
  const container = el("exam-cards");
  container.textContent = "";
  EXAMS.forEach(exam => {
    const card = document.createElement("div");
    card.className = "exam-card";
    card.addEventListener("click", () => startExam(exam.id));

    const numDiv = document.createElement("div");
    numDiv.className = "exam-number";
    numDiv.textContent = "Exam " + exam.id;
    card.appendChild(numDiv);

    const h3 = document.createElement("h3");
    h3.textContent = exam.title;
    card.appendChild(h3);

    const sub = document.createElement("div");
    sub.className = "exam-desc";
    sub.style.cssText = "font-size:0.8rem;color:var(--green-dim);margin-bottom:0.5rem;font-weight:500;";
    sub.textContent = exam.subtitle;
    card.appendChild(sub);

    const meta = document.createElement("div");
    meta.className = "exam-meta";
    const qSpan = document.createElement("span");
    qSpan.textContent = exam.count + " questions";
    const tSpan = document.createElement("span");
    tSpan.textContent = exam.time + " minutes";
    meta.appendChild(qSpan);
    meta.appendChild(tSpan);
    card.appendChild(meta);

    const desc = document.createElement("div");
    desc.className = "exam-desc";
    desc.textContent = exam.desc;
    card.appendChild(desc);

    const best = getBestScore(exam.id);
    const scoreDiv = document.createElement("div");
    scoreDiv.className = "best-score";
    if (best) {
      scoreDiv.classList.add(best.passed ? "pass" : "fail");
      scoreDiv.textContent = "Best: " + best.score + "/1000" + (best.passed ? " PASS" : " FAIL");
    } else {
      scoreDiv.classList.add("none");
      scoreDiv.textContent = "Not attempted";
    }
    card.appendChild(scoreDiv);
    container.appendChild(card);
  });
}

/* mode selector */
document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.mode = btn.getAttribute("data-mode");
  });
});

/* ═══════════════════════════════════════
   START EXAM
   ═══════════════════════════════════════ */
function startExam(examId) {
  state.examId = examId;
  state.submitted = false;
  state.answers = {};
  state.flags = new Set();
  state.currentQ = 0;
  state.showExplanation = {};
  state.startTime = Date.now();

  const examQuestions = QUESTIONS.filter(q => q.examId === examId);
  state.questions = shuffleArray(examQuestions);

  // Shuffle options for non-ordering questions
  state.questions.forEach((q, i) => {
    if (q.type === "ordering") {
      // For ordering, create a shuffled copy and track mapping
      const indices = q.options.map((_, idx) => idx);
      const shuffled = shuffleArray(indices);
      q._displayOrder = shuffled;
    } else {
      const indices = q.options.map((_, idx) => idx);
      const shuffled = shuffleArray(indices);
      q._displayOrder = shuffled;
      q._reverseMap = new Array(q.options.length);
      shuffled.forEach((origIdx, dispIdx) => {
        q._reverseMap[origIdx] = dispIdx;
      });
    }
  });

  const exam = EXAMS.find(e => e.id === examId);
  state.timerSeconds = exam.time * 60;

  if (state.mode === "timed") {
    startTimer();
    el("timer-box").classList.remove("hidden");
  } else {
    el("timer-box").classList.add("hidden");
  }

  show("exam");
  renderNavigator();
  renderQuestion();
}

/* ═══════════════════════════════════════
   TIMER
   ═══════════════════════════════════════ */
function startTimer() {
  clearInterval(state.timerInterval);
  updateTimerDisplay();
  state.timerInterval = setInterval(() => {
    state.timerSeconds--;
    if (state.timerSeconds <= 0) {
      state.timerSeconds = 0;
      clearInterval(state.timerInterval);
      submitExam();
      return;
    }
    updateTimerDisplay();
    // Persist timer
    localStorage.setItem(TIMER_KEY, JSON.stringify({
      examId: state.examId,
      seconds: state.timerSeconds,
      ts: Date.now()
    }));
  }, 1000);
}

function updateTimerDisplay() {
  const display = el("timer-display");
  display.textContent = formatTime(state.timerSeconds);
  display.classList.remove("warning", "danger");
  if (state.timerSeconds <= 600) display.classList.add("danger");
  else if (state.timerSeconds <= 1800) display.classList.add("warning");
}

/* ═══════════════════════════════════════
   NAVIGATOR
   ═══════════════════════════════════════ */
function renderNavigator() {
  const grid = el("q-grid");
  grid.textContent = "";
  state.questions.forEach((_, i) => {
    const cell = document.createElement("button");
    cell.className = "q-cell";
    cell.textContent = String(i + 1);
    cell.addEventListener("click", () => goToQuestion(i));
    grid.appendChild(cell);
  });
  updateNavigator();
}

function updateNavigator() {
  const cells = el("q-grid").children;
  const answered = Object.keys(state.answers).length;
  el("nav-progress").textContent = answered + " / " + state.questions.length + " answered";

  for (let i = 0; i < cells.length; i++) {
    cells[i].className = "q-cell";
    if (i === state.currentQ) cells[i].classList.add("current");
    if (state.answers[i] !== undefined) cells[i].classList.add("answered");
    if (state.flags.has(i)) cells[i].classList.add("flagged");
  }
}

function goToQuestion(idx) {
  state.currentQ = idx;
  updateNavigator();
  renderQuestion();
}

/* ═══════════════════════════════════════
   RENDER QUESTION
   ═══════════════════════════════════════ */
function renderQuestion() {
  const panel = el("question-panel");
  panel.textContent = "";
  const q = state.questions[state.currentQ];
  const qIdx = state.currentQ;

  // Header
  const header = document.createElement("div");
  header.className = "q-header";
  const headerLeft = document.createElement("div");
  headerLeft.className = "q-header-left";

  const qNum = document.createElement("span");
  qNum.className = "question-number";
  qNum.textContent = "Question " + (qIdx + 1) + " of " + state.questions.length;
  headerLeft.appendChild(qNum);

  const domBadge = document.createElement("span");
  domBadge.className = "q-domain-badge";
  domBadge.style.borderColor = DOMAIN_COLORS[q.domain];
  domBadge.style.color = DOMAIN_COLORS[q.domain];
  domBadge.textContent = "D" + q.domain + ": " + DOMAIN_NAMES[q.domain];
  headerLeft.appendChild(domBadge);

  const typeBadge = document.createElement("span");
  typeBadge.className = "q-type-badge";
  const typeNames = {mc:"Single Answer",ms:"Multi-Select",scenario:"Scenario",ordering:"Ordering"};
  typeBadge.textContent = typeNames[q.type] || q.type;
  headerLeft.appendChild(typeBadge);

  header.appendChild(headerLeft);

  const flagBtn = document.createElement("button");
  flagBtn.className = "flag-btn" + (state.flags.has(qIdx) ? " flagged" : "");
  flagBtn.textContent = state.flags.has(qIdx) ? "Flagged" : "Flag for review";
  flagBtn.addEventListener("click", () => {
    if (state.flags.has(qIdx)) state.flags.delete(qIdx);
    else state.flags.add(qIdx);
    flagBtn.className = "flag-btn" + (state.flags.has(qIdx) ? " flagged" : "");
    flagBtn.textContent = state.flags.has(qIdx) ? "Flagged" : "Flag for review";
    updateNavigator();
  });
  header.appendChild(flagBtn);
  panel.appendChild(header);

  // Scenario box
  if (q.scenario) {
    const scenBox = document.createElement("div");
    scenBox.className = "scenario-box";
    const scenLabel = document.createElement("div");
    scenLabel.className = "scenario-label";
    scenLabel.textContent = "Scenario";
    scenBox.appendChild(scenLabel);
    const scenText = document.createElement("div");
    scenText.textContent = q.scenario;
    scenBox.appendChild(scenText);
    panel.appendChild(scenBox);
  }

  // Question text
  const qText = document.createElement("div");
  qText.className = "question-text";
  qText.textContent = q.question;
  panel.appendChild(qText);

  // Multi-select hint
  if (q.type === "ms") {
    const hint = document.createElement("div");
    hint.className = "multi-select-hint";
    const count = Array.isArray(q.correct) ? q.correct.length : 2;
    hint.textContent = "Select " + count + " that apply.";
    panel.appendChild(hint);
  }

  // Options
  if (q.type === "ordering") {
    renderOrderingOptions(panel, q, qIdx);
  } else {
    renderChoiceOptions(panel, q, qIdx);
  }

  // Review mode: show explanation button
  if (state.mode === "review" && state.answers[qIdx] !== undefined) {
    renderExplanation(panel, q, qIdx);
  }

  // Footer navigation
  const footer = document.createElement("div");
  footer.className = "q-footer";

  const prevBtn = document.createElement("button");
  prevBtn.className = "btn btn-secondary";
  prevBtn.textContent = "Previous";
  prevBtn.disabled = qIdx === 0;
  prevBtn.addEventListener("click", () => { if (qIdx > 0) goToQuestion(qIdx - 1); });

  const center = document.createElement("span");
  center.className = "q-footer-center";
  center.textContent = (qIdx + 1) + " / " + state.questions.length;

  const rightDiv = document.createElement("div");
  rightDiv.style.display = "flex";
  rightDiv.style.gap = "0.5rem";

  if (qIdx === state.questions.length - 1) {
    const submitBtn = document.createElement("button");
    submitBtn.className = "btn btn-primary";
    submitBtn.textContent = "Submit Exam";
    submitBtn.addEventListener("click", confirmSubmit);
    rightDiv.appendChild(submitBtn);
  } else {
    const nextBtn = document.createElement("button");
    nextBtn.className = "btn btn-primary";
    nextBtn.textContent = "Next";
    nextBtn.addEventListener("click", () => goToQuestion(qIdx + 1));
    rightDiv.appendChild(nextBtn);
  }

  footer.appendChild(prevBtn);
  footer.appendChild(center);
  footer.appendChild(rightDiv);
  panel.appendChild(footer);
}

function renderChoiceOptions(panel, q, qIdx) {
  const list = document.createElement("ul");
  list.className = "option-list";
  const letters = "ABCDEFGH";

  q._displayOrder.forEach((origIdx, dispIdx) => {
    const li = document.createElement("li");
    li.className = "option-item";

    // Check if selected
    const answer = state.answers[qIdx];
    if (q.type === "ms") {
      if (Array.isArray(answer) && answer.includes(origIdx)) li.classList.add("selected");
    } else {
      if (answer === origIdx) li.classList.add("selected");
    }

    const letterSpan = document.createElement("span");
    letterSpan.className = "option-letter";
    letterSpan.textContent = letters[dispIdx];
    li.appendChild(letterSpan);

    const textSpan = document.createElement("span");
    textSpan.textContent = q.options[origIdx];
    li.appendChild(textSpan);

    li.addEventListener("click", () => {
      if (state.submitted) return;
      selectOption(qIdx, origIdx, q);
    });

    list.appendChild(li);
  });
  panel.appendChild(list);
}

function renderOrderingOptions(panel, q, qIdx) {
  const list = document.createElement("ul");
  list.className = "ordering-list";
  list.setAttribute("data-qidx", String(qIdx));

  // Current order: either user's answer or the shuffled display order
  const currentOrder = state.answers[qIdx] || q._displayOrder.slice();

  currentOrder.forEach((origIdx, pos) => {
    const li = document.createElement("li");
    li.className = "ordering-item";
    li.setAttribute("draggable", "true");
    li.setAttribute("data-origidx", String(origIdx));

    const numSpan = document.createElement("span");
    numSpan.className = "order-num";
    numSpan.textContent = String(pos + 1);
    li.appendChild(numSpan);

    const textSpan = document.createElement("span");
    textSpan.textContent = q.options[origIdx];
    li.appendChild(textSpan);

    // Drag events
    li.addEventListener("dragstart", (e) => {
      li.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", String(pos));
    });
    li.addEventListener("dragend", () => li.classList.remove("dragging"));
    li.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
    });
    li.addEventListener("drop", (e) => {
      e.preventDefault();
      const fromPos = parseInt(e.dataTransfer.getData("text/plain"), 10);
      const toPos = pos;
      if (fromPos === toPos) return;
      const order = (state.answers[qIdx] || q._displayOrder.slice());
      const item = order.splice(fromPos, 1)[0];
      order.splice(toPos, 0, item);
      state.answers[qIdx] = order;
      updateNavigator();
      renderQuestion();
    });

    list.appendChild(li);
  });
  panel.appendChild(list);
}

function selectOption(qIdx, origIdx, q) {
  if (q.type === "ms") {
    let current = state.answers[qIdx] || [];
    if (!Array.isArray(current)) current = [];
    const idx = current.indexOf(origIdx);
    if (idx >= 0) {
      current.splice(idx, 1);
    } else {
      current.push(origIdx);
    }
    state.answers[qIdx] = current.length > 0 ? current : undefined;
    if (current.length === 0) delete state.answers[qIdx];
  } else {
    state.answers[qIdx] = origIdx;
  }
  updateNavigator();
  renderQuestion();
}

function renderExplanation(panel, q, qIdx) {
  const expDiv = document.createElement("div");
  expDiv.className = "explanation fade-in";
  expDiv.style.marginTop = "1rem";

  const strong = document.createElement("strong");
  strong.textContent = "Explanation: ";
  expDiv.appendChild(strong);

  const text = document.createTextNode(q.explanation);
  expDiv.appendChild(text);

  // Show correct answer
  if (q.type === "ordering") {
    const correctText = document.createElement("div");
    correctText.style.marginTop = "0.5rem";
    correctText.style.color = "var(--green)";
    const correctOrder = q.correct.map((idx, pos) => (pos + 1) + ". " + q.options[idx]).join(" → ");
    const correctLabel = document.createElement("strong");
    correctLabel.textContent = "Correct order: ";
    correctText.appendChild(correctLabel);
    correctText.appendChild(document.createTextNode(correctOrder));
    expDiv.appendChild(correctText);
  } else if (q.type === "ms") {
    const correctText = document.createElement("div");
    correctText.style.marginTop = "0.5rem";
    correctText.style.color = "var(--green)";
    const correctLabel = document.createElement("strong");
    correctLabel.textContent = "Correct: ";
    correctText.appendChild(correctLabel);
    correctText.appendChild(document.createTextNode(q.correct.map(i => q.options[i]).join("; ")));
    expDiv.appendChild(correctText);
  } else {
    const correctText = document.createElement("div");
    correctText.style.marginTop = "0.5rem";
    correctText.style.color = "var(--green)";
    const correctLabel = document.createElement("strong");
    correctLabel.textContent = "Correct: ";
    correctText.appendChild(correctLabel);
    correctText.appendChild(document.createTextNode(q.options[q.correct]));
    expDiv.appendChild(correctText);
  }

  panel.appendChild(expDiv);
}

/* ═══════════════════════════════════════
   SUBMIT EXAM
   ═══════════════════════════════════════ */
function confirmSubmit() {
  const answered = Object.keys(state.answers).length;
  const total = state.questions.length;
  const flagged = state.flags.size;
  const unanswered = total - answered;

  const backdrop = el("confirm-modal");
  const body = el("confirm-modal-body");
  body.textContent = "";
  backdrop.classList.remove("hidden");

  const h2 = document.createElement("h2");
  h2.textContent = "Submit Exam?";
  body.appendChild(h2);

  const p = document.createElement("p");
  p.textContent = "Review your progress before submitting. Unanswered questions will be scored as incorrect.";
  body.appendChild(p);

  const statsRow = document.createElement("div");
  statsRow.className = "stats-row";

  [{num: answered, lbl: "Answered", color: "var(--green)"},
   {num: unanswered, lbl: "Unanswered", color: "var(--text-muted)"},
   {num: flagged, lbl: "Flagged", color: "var(--yellow)"}].forEach(s => {
    const stat = document.createElement("div");
    stat.className = "stat";
    const num = document.createElement("div");
    num.className = "num";
    num.style.color = s.color;
    num.textContent = String(s.num);
    stat.appendChild(num);
    const lbl = document.createElement("div");
    lbl.className = "lbl";
    lbl.textContent = s.lbl;
    stat.appendChild(lbl);
    statsRow.appendChild(stat);
  });
  body.appendChild(statsRow);

  const btnRow = document.createElement("div");
  btnRow.className = "btn-row";

  const cancelBtn = document.createElement("button");
  cancelBtn.className = "btn btn-secondary";
  cancelBtn.textContent = "Continue Exam";
  cancelBtn.addEventListener("click", () => backdrop.classList.add("hidden"));

  const submitBtn = document.createElement("button");
  submitBtn.className = "btn btn-primary";
  submitBtn.textContent = "Submit";
  submitBtn.addEventListener("click", () => {
    backdrop.classList.add("hidden");
    submitExam();
  });

  btnRow.appendChild(cancelBtn);
  btnRow.appendChild(submitBtn);
  body.appendChild(btnRow);
}

function isCorrect(q, answer) {
  if (answer === undefined || answer === null) return false;
  if (q.type === "ordering") {
    if (!Array.isArray(answer)) return false;
    return JSON.stringify(answer) === JSON.stringify(q.correct);
  }
  if (q.type === "ms") {
    if (!Array.isArray(answer)) return false;
    const sorted = answer.slice().sort();
    const correctSorted = q.correct.slice().sort();
    return JSON.stringify(sorted) === JSON.stringify(correctSorted);
  }
  return answer === q.correct;
}

function submitExam() {
  state.submitted = true;
  clearInterval(state.timerInterval);
  localStorage.removeItem(TIMER_KEY);

  const total = state.questions.length;
  const pointsPerQ = 1000 / total;
  let correctCount = 0;
  const domainScores = {};

  for (let d = 1; d <= 6; d++) {
    domainScores[d] = {correct: 0, total: 0};
  }

  state.questions.forEach((q, i) => {
    domainScores[q.domain].total++;
    if (isCorrect(q, state.answers[i])) {
      correctCount++;
      domainScores[q.domain].correct++;
    }
  });

  const score = Math.round(correctCount * pointsPerQ);
  const passed = score >= 700;
  const timeSpent = Math.round((Date.now() - state.startTime) / 1000);

  const result = {
    examId: state.examId,
    score: score,
    passed: passed,
    date: new Date().toISOString(),
    domainScores: domainScores,
    timeSpent: timeSpent,
    mode: state.mode,
    correctCount: correctCount,
    totalQuestions: total
  };
  saveResult(result);

  renderResults(result);
  show("results");
}

  container.appendChild(header);

  // Stats grid

  statsGrid.className = "stats-grid";

  [{val: result.correctCount, lbl: "Correct"},

    const lbl = document.createElement("div");
    lbl.className = "stat-label";

    card.appendChild(lbl);
    statsGrid.appendChild(card);

  chartTitle.style.marginBottom = "1rem";
  chartSection.appendChild(chartTitle);

  for (let d = 1; d <= 6; d++) {
    const ds = result.domainScores[d];

    row.className = "domain-bar-row";

    row.appendChild(label);

    const track = document.createElement("div");

    const fill = document.createElement("div");

    threshold.className = "domain-bar-threshold";

function renderReviewSection(container) {
  // Remove existing review if present
  const existing = container.querySelector(".review-section");
  if (existing) { existing.remove(); return; }

  const section = document.createElement("div");
  section.className = "review-section";

  const h2 = document.createElement("h2");
  h2.textContent = "Answer Review";
  h2.style.marginBottom = "1rem";
  section.appendChild(h2);

  // Filter controls
  const filters = document.createElement("div");
  filters.style.cssText = "display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;";
  let currentFilter = "all";

  ["all","incorrect","correct","flagged"].forEach(f => {
    const btn = document.createElement("button");
    btn.className = "btn btn-sm " + (f === "all" ? "btn-primary" : "btn-secondary");
    btn.textContent = f.charAt(0).toUpperCase() + f.slice(1);
    btn.addEventListener("click", () => {
      currentFilter = f;
      filters.querySelectorAll(".btn").forEach(b => {
        b.className = "btn btn-sm " + (b.textContent.toLowerCase() === f ? "btn-primary" : "btn-secondary");
      });
      renderFilteredQuestions();
    });
    filters.appendChild(btn);
  });
  section.appendChild(filters);

  const questionsDiv = document.createElement("div");
  questionsDiv.id = "review-questions-list";
  section.appendChild(questionsDiv);

  container.appendChild(section);

  function renderFilteredQuestions() {
    questionsDiv.textContent = "";
    state.questions.forEach((q, i) => {
      const correct = isCorrect(q, state.answers[i]);
      if (currentFilter === "incorrect" && correct) return;
      if (currentFilter === "correct" && !correct) return;
      if (currentFilter === "flagged" && !state.flags.has(i)) return;

      const card = document.createElement("div");
      card.className = "review-q " + (correct ? "q-correct" : "q-incorrect");

      // Header
      const rHeader = document.createElement("div");
      rHeader.className = "review-header";

      const qNum = document.createElement("span");
      qNum.className = "question-number";
      qNum.textContent = "Q" + (i + 1);
      rHeader.appendChild(qNum);

      const domBadge = document.createElement("span");
      domBadge.className = "q-domain-badge";
      domBadge.style.borderColor = DOMAIN_COLORS[q.domain];
      domBadge.style.color = DOMAIN_COLORS[q.domain];
      domBadge.textContent = "D" + q.domain;
      rHeader.appendChild(domBadge);

      const resultBadge = document.createElement("span");
      resultBadge.className = "review-result-badge " + (correct ? "correct" : "incorrect");
      resultBadge.textContent = correct ? "Correct" : "Incorrect";
      rHeader.appendChild(resultBadge);

      card.appendChild(rHeader);

      // Question
      if (q.scenario) {
        const scenBox = document.createElement("div");
        scenBox.className = "scenario-box";
        scenBox.style.marginBottom = "0.75rem";
        const scenLabel = document.createElement("div");
        scenLabel.className = "scenario-label";
        scenLabel.textContent = "Scenario";
        scenBox.appendChild(scenLabel);
        const scenText = document.createElement("div");
        scenText.textContent = q.scenario;
        scenBox.appendChild(scenText);
        card.appendChild(scenBox);
      }

      const qText = document.createElement("div");
      qText.className = "question-text";
      qText.style.fontSize = "0.9rem";
      qText.textContent = q.question;
      card.appendChild(qText);

      // Options with correct/incorrect highlighting
      if (q.type === "ordering") {
        renderReviewOrdering(card, q, i);
      } else {
        renderReviewOptions(card, q, i);
      }

      // Explanation
      const expDiv = document.createElement("div");
      expDiv.className = "explanation";
      const expStrong = document.createElement("strong");
      expStrong.textContent = "Explanation: ";
      expDiv.appendChild(expStrong);
      expDiv.appendChild(document.createTextNode(q.explanation));
      card.appendChild(expDiv);

      questionsDiv.appendChild(card);
    });

    if (questionsDiv.children.length === 0) {
      const empty = document.createElement("div");
      empty.style.cssText = "text-align:center;color:var(--text-muted);padding:2rem;";
      empty.textContent = "No questions match this filter.";
      questionsDiv.appendChild(empty);
    }
  }

  renderFilteredQuestions();
  section.scrollIntoView({behavior: "smooth"});
}

function renderReviewOptions(card, q, qIdx) {
  const list = document.createElement("ul");
  list.className = "option-list";
  const letters = "ABCDEFGH";
  const answer = state.answers[qIdx];

  q.options.forEach((opt, origIdx) => {
    const li = document.createElement("li");
    li.className = "option-item";
    li.style.cursor = "default";

    const isUserSelected = q.type === "ms"
      ? (Array.isArray(answer) && answer.includes(origIdx))
      : answer === origIdx;
    const isCorrectOpt = q.type === "ms"
      ? q.correct.includes(origIdx)
      : q.correct === origIdx;

    if (isCorrectOpt) li.classList.add("correct");
    else if (isUserSelected && !isCorrectOpt) li.classList.add("incorrect");

    const letterSpan = document.createElement("span");
    letterSpan.className = "option-letter";
    letterSpan.textContent = letters[origIdx];
    li.appendChild(letterSpan);

    const textSpan = document.createElement("span");
    textSpan.textContent = opt;
    li.appendChild(textSpan);

    if (isUserSelected) {
      const marker = document.createElement("span");
      marker.style.cssText = "margin-left:auto;font-size:0.75rem;font-weight:600;";
      marker.textContent = isCorrectOpt ? "Your answer" : "Your answer";
      marker.style.color = isCorrectOpt ? "var(--green)" : "var(--red)";
      li.appendChild(marker);
    }

    list.appendChild(li);
  });
  card.appendChild(list);
}

function renderReviewOrdering(card, q, qIdx) {
  const userOrder = state.answers[qIdx] || [];
  const correctOrder = q.correct;

  const wrapper = document.createElement("div");
  wrapper.style.cssText = "display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:0.5rem 0;";

  // User's order
  const userCol = document.createElement("div");
  const userLabel = document.createElement("div");
  userLabel.style.cssText = "font-size:0.75rem;color:var(--text-muted);margin-bottom:0.5rem;font-weight:600;";
  userLabel.textContent = "Your Order";
  userCol.appendChild(userLabel);
  userOrder.forEach((origIdx, pos) => {
    const item = document.createElement("div");
    item.style.cssText = "padding:0.4rem 0.6rem;border-radius:4px;font-size:0.8rem;margin-bottom:0.25rem;border:1px solid;";
    const isCorrectPos = correctOrder[pos] === origIdx;
    item.style.borderColor = isCorrectPos ? "var(--green)" : "var(--red)";
    item.style.color = isCorrectPos ? "var(--green)" : "var(--red)";
    item.textContent = (pos + 1) + ". " + q.options[origIdx];
    userCol.appendChild(item);
  });
  wrapper.appendChild(userCol);

  // Correct order
  const correctCol = document.createElement("div");
  const correctLabel = document.createElement("div");
  correctLabel.style.cssText = "font-size:0.75rem;color:var(--green);margin-bottom:0.5rem;font-weight:600;";
  correctLabel.textContent = "Correct Order";
  correctCol.appendChild(correctLabel);
  correctOrder.forEach((origIdx, pos) => {
    const item = document.createElement("div");
    item.style.cssText = "padding:0.4rem 0.6rem;border-radius:4px;font-size:0.8rem;margin-bottom:0.25rem;border:1px solid var(--green);color:var(--green);";
    item.textContent = (pos + 1) + ". " + q.options[origIdx];
    correctCol.appendChild(item);
  });
  wrapper.appendChild(correctCol);

  card.appendChild(wrapper);
}

/* ═══════════════════════════════════════
   KEYBOARD NAVIGATION
   ═══════════════════════════════════════ */
document.addEventListener("keydown", (e) => {
  if (state.screen !== "exam" || state.submitted) return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown") {
    e.preventDefault();
    if (state.currentQ < state.questions.length - 1) goToQuestion(state.currentQ + 1);
  } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
    e.preventDefault();
    if (state.currentQ > 0) goToQuestion(state.currentQ - 1);
  } else if (e.key === "f" || e.key === "F") {
    if (document.activeElement && (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA")) return;
    if (state.flags.has(state.currentQ)) state.flags.delete(state.currentQ);
    else state.flags.add(state.currentQ);
    updateNavigator();
    renderQuestion();
  }
});

// ── Bionic Reading ──
(function() {
  var BIONIC_KEY = 'gh600_bionic_enabled';
  var btn = document.getElementById('bionicToggle');
  var originalNodes = new Map();
  var bionicActive = false;

  function bionicWord(word) {
    if (word.length <= 1) return word;
    var mid = Math.ceil(word.length / 2);
    return '<span class="bionic-bold">' + word.slice(0, mid) + '</span><span class="bionic-unbold">' + word.slice(mid) + '</span>';
  }

  function bionicText(text) {
    return text.replace(/\S+/g, function(word) {
      if (word.charAt(0) === '&' && word.indexOf(';') !== -1) return word;
      return bionicWord(word);
    });
  }

  function getContentNodes() {
    var selectors = '.container p, .container .question-text, .container .explanation, .container td, .container li, .container .card-title, .container-wide p, .container-wide .question-text, .container-wide td, .container-wide li, .exam-hero .subtitle, .exam-card .exam-desc, #screen-exam .question-text, #screen-exam .explanation, #screen-review .question-text, #screen-review .explanation';
    return document.querySelectorAll(selectors);
  }

  function applyBionic() {
    var nodes = getContentNodes();
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (el.closest('pre') || el.closest('code') || el.closest('nav') || el.closest('.top-nav') || el.closest('button') || el.tagName === 'BUTTON') continue;
      if (!originalNodes.has(el)) {
        originalNodes.set(el, el.innerHTML);
      }
      el.innerHTML = bionicText(originalNodes.get(el));
    }
  }

  function removeBionic() {
    originalNodes.forEach(function(html, el) {
      el.innerHTML = html;
    });
    originalNodes.clear();
  }

  function toggle() {
    bionicActive = !bionicActive;
    if (bionicActive) {
      btn.classList.add('active');
      applyBionic();
    } else {
      btn.classList.remove('active');
      removeBionic();
    }
    try { localStorage.setItem(BIONIC_KEY, bionicActive ? '1' : '0'); } catch(e) {}
  }

  // Re-apply bionic after dynamic content renders
  window.bionicReapply = function() {
    if (bionicActive) {
      originalNodes.clear();
      applyBionic();
    }
  };

  btn.addEventListener('click', toggle);

  try {
    if (localStorage.getItem(BIONIC_KEY) === '1') {
      bionicActive = false;
      toggle();
    }
  } catch(e) {}
})();
