// ── Domain 1: Architecture & SDLC (10) ──
{id:"3-1",examId:3,domain:1,type:"scenario",
scenario:"A platform team is designing an agent-assisted incident response system. When a production alert fires, an agent should: (1) Gather diagnostic data from logs, metrics, and recent deployments, (2) Correlate the data to identify probable root causes, (3) Suggest remediation steps, (4) If approved by the on-call engineer, execute the remediation. The system handles critical infrastructure serving 10M users.",
question:"Which architectural decision is MOST critical for this system?",
options:[
"Using the fastest language model to minimize response time",
"Implementing progressive autonomy where the agent has full autonomy for data gathering (steps 1-2) but requires human approval before executing remediation (step 4), with clear fallback to full manual control",
"Making the agent fully autonomous to minimize incident response time",
"Restricting the agent to only suggesting remediation without any automated data gathering"
],correct:1,
explanation:"For critical infrastructure, progressive autonomy is key. Steps 1-2 (data gathering, correlation) are read-only and low-risk — the agent can do these autonomously to speed up diagnosis. Step 4 (remediation execution) is high-risk and irreversible — it requires human approval. This architecture minimizes response time while maintaining safety for production-affecting actions."},

{id:"3-2",examId:3,domain:1,type:"ms",
question:"Select THREE anti-patterns that are MOST likely to cause cascading failures in production agentic systems.",
options:[
"Missing traceability — no audit trail of what the agent did and why",
"Over-autonomy — the agent can take irreversible actions without approval",
"Goal drift — the agent subtly shifts from its intended objective",
"Using structured JSON output for inter-agent communication",
"Implementing health checks for agent processes"
],correct:[0,1,2],
explanation:"Missing traceability prevents post-incident diagnosis. Over-autonomy allows irreversible damage before anyone notices. Goal drift causes the agent to pursue increasingly wrong objectives. Together, these create a scenario where the agent does damage (over-autonomy), for the wrong reasons (goal drift), and no one can determine what happened (missing traceability). Structured output and health checks are best practices."},

{id:"3-3",examId:3,domain:1,type:"mc",
question:"A team is debating the tradeoff between agent reliability and agent speed. Their agent can either produce thorough, well-tested PRs in 15 minutes, or quick draft PRs in 2 minutes that often need follow-up fixes. For a regulated healthcare application, which approach is correct?",
options:[
"Quick drafts, since development velocity is always the top priority",
"Thorough PRs, because in regulated environments the cost of defects (patient safety, compliance violations) far exceeds the time savings from faster drafts",
"It depends on the developer's personal preference",
"Neither — agents should not be used in healthcare applications"
],correct:1,
explanation:"In regulated healthcare, defect costs include patient safety risks, FDA compliance violations, and HIPAA exposure. A 13-minute time savings per PR is insignificant compared to the cost of a compliance violation or safety incident caused by a hastily generated PR that slipped through review. Regulated environments should optimize for reliability over speed."},

{id:"3-4",examId:3,domain:1,type:"mc",
question:"What is the relationship between planning artifacts and observability in agentic systems?",
options:[
"Planning artifacts and observability are completely independent concerns",
"Planning artifacts provide the expected execution plan, while observability provides the actual execution trace, and comparing the two enables detection of deviations, failures, and unexpected behaviors",
"Observability replaces the need for planning artifacts",
"Planning artifacts are only useful before execution; observability is only useful after"
],correct:1,
explanation:"Planning artifacts (the intended plan) and observability data (the actual execution) form a pair. By comparing what the agent planned to do against what it actually did, teams can detect deviations, identify where and why the agent diverged from its plan, and determine if the deviation was beneficial (adaptive) or harmful (drift/failure)."},

{id:"3-5",examId:3,domain:1,type:"mc",
question:"An organization is evaluating whether to give their deployment agent Level 3 autonomy (autonomous with periodic review) or Level 2 (autonomous for routine tasks, human approval for significant ones). The agent deploys to a staging environment used only by the QA team. Which level is appropriate?",
options:[
"Level 2 — staging environments should always require human approval for every deployment",
"Level 3 — since staging is non-production and affects only the QA team, the risk is lower and periodic review is sufficient, provided rollback capability exists",
"Level 4 — staging environments need no oversight at all",
"Level 0 — no agent involvement in deployments"
],correct:1,
explanation:"Staging environments have lower risk than production: they don't affect end users, and QA teams expect frequent changes. Level 3 autonomy with periodic review is appropriate as long as rollback capability exists for quick recovery. This gives the agent speed while maintaining accountability through regular review cycles. Level 2 would unnecessarily slow down QA iteration."},

{id:"3-6",examId:3,domain:1,type:"mc",
question:"What distinguishes a 'scope creep' anti-pattern from a 'goal drift' anti-pattern in practice?",
options:[
"They are identical concepts with different names",
"Scope creep means the agent takes on additional tasks beyond its mandate while pursuing the original goal; goal drift means the agent's fundamental objective gradually shifts away from what was originally intended",
"Scope creep only happens in multi-agent systems; goal drift only happens in single-agent systems",
"Goal drift is always more dangerous than scope creep"
],correct:1,
explanation:"Scope creep and goal drift are related but distinct. Scope creep: the agent's goal stays the same, but it does more than authorized (e.g., tasked with refactoring but also renames variables). Goal drift: the agent's actual objective gradually shifts (e.g., tasked with improving performance but gradually optimizes for code readability instead). Both need different detection and prevention strategies."},

{id:"3-7",examId:3,domain:1,type:"mc",
question:"How should an agentic system handle the situation where its plan becomes invalid due to external changes during execution?",
options:[
"Continue executing the original plan since it was validated at the start",
"Detect the invalidation through observability signals, pause execution, re-evaluate the current state, re-plan from the current position, and resume with an updated plan",
"Abort the entire task and start over from scratch",
"Ignore external changes until the current plan completes"
],correct:1,
explanation:"Adaptive re-planning is the correct approach. The agent should detect that external changes have invalidated its plan (through observability), pause to avoid acting on stale assumptions, re-evaluate the current actual state, create an updated plan from the current position, and resume. This preserves completed work while adapting to new reality."},

{id:"3-8",examId:3,domain:1,type:"mc",
question:"In the GitHub contributor model for agents, why is it important that agent-created branches follow a consistent naming convention?",
options:[
"Branch naming has no impact on agent workflows",
"Consistent naming enables traceability (identifying agent-created branches), policy enforcement (branch protection rules can match naming patterns), and cleanup automation (stale agent branches can be identified and pruned)",
"Branch names must match the agent's API key",
"GitHub requires a specific branch naming format for all automated systems"
],correct:1,
explanation:"Consistent branch naming (e.g., 'copilot/' or 'agent/' prefix) serves three purposes: traceability (you can identify which branches were created by agents), policy enforcement (branch protection rules and rulesets can target naming patterns), and automation (cleanup scripts can identify and prune stale agent branches). This is a practical governance mechanism."},

{id:"3-9",examId:3,domain:1,type:"scenario",
scenario:"A team is designing an agent that manages dependency updates across a monorepo with 8 services. Some services share common libraries, and updating a shared library requires coordinated changes across multiple services. The team wants the agent to handle both independent and coordinated updates.",
question:"Which architectural approach handles this complexity correctly?",
options:[
"Have the agent update each service independently, ignoring cross-service dependencies",
"Implement dependency graph analysis in the agent's planning phase so it can detect shared dependencies, plan coordinated multi-service updates when needed, and validate cross-service compatibility before creating PRs",
"Restrict the agent to only updating dependencies that don't cross service boundaries",
"Run a separate agent instance for each service with no coordination between them"
],correct:1,
explanation:"The agent needs dependency graph awareness to handle coordinated updates correctly. During planning, it should analyze the dependency graph to detect shared libraries, plan multi-service updates as atomic units, and validate cross-service compatibility. Independent updates ignore the problem, and restricting scope means shared dependencies never get updated."},

{id:"3-53",examId:3,domain:1,type:"scenario",
scenario:"A team is onboarding a new developer who will use GitHub Copilot extensively. The developer asks about the safety model for Agent mode: 'If Copilot's agent wants to run rm -rf on a directory or execute a destructive database migration, does it just do it?'",
question:"What is the correct explanation of how Agent mode handles risky operations?",
options:[
"Agent mode runs all terminal commands automatically without any user interaction",
"Agent mode analyzes terminal commands for risk and surfaces potentially destructive operations for explicit user approval before execution, while safe read-only commands may proceed automatically based on the configured approval policy",
"Agent mode is blocked from running any terminal commands — it can only edit files",
"Agent mode requires the user to manually copy and paste every command into a separate terminal"
],correct:1,
explanation:"Agent mode includes a safety mechanism for terminal commands: it classifies commands by risk level and presents potentially destructive operations (like rm -rf, database mutations, or force pushes) for explicit user approval. This balances autonomy with safety — routine commands like running tests or listing files can proceed without interruption, while high-risk commands get a human-in-the-loop check. The exact approval policy is configurable."},

// ── Domain 2: Tool Use & Environment (15) ──
{id:"3-10",examId:3,domain:2,type:"scenario",
scenario:"Your organization uses a custom MCP registry backed by Azure API Center. The registry currently lists 20 approved MCP servers. A new team wants to add a third-party MCP server that provides Jira integration. The organization policy is 'Registry only' for the MCP allow list.",
question:"What is the correct process to make the Jira MCP server available?",
options:[
"Have the team add it directly to their VS Code settings, bypassing the registry",
"Submit the Jira MCP server for review, add it to the Azure API Center registry after approval, and it will automatically become available to users under the 'Registry only' policy",
"Change the organization policy from 'Registry only' to 'Allow all' so the team can use any server",
"The team must build their own Jira integration from scratch instead of using an MCP server"
],correct:1,
explanation:"Under a 'Registry only' policy, the correct process is to submit the new MCP server for organizational review, and if approved, add it to the Azure API Center registry. Once registered, it becomes available to all users automatically. Bypassing the registry violates organizational policy, and changing to 'Allow all' undermines governance for all teams."},

{id:"3-11",examId:3,domain:2,type:"ms",
question:"Select THREE security considerations when configuring remote MCP servers for use with GitHub Copilot.",
options:[
"Verify the server uses HTTPS with valid TLS certificates",
"Validate that the server is listed in an approved registry and authorized by organizational policy",
"Ensure authentication credentials are stored securely and not embedded in configuration files",
"Configure the server to use plain HTTP for faster response times",
"Disable CORS validation to allow unrestricted access"
],correct:[0,1,2],
explanation:"Remote MCP servers must use HTTPS for encrypted communication, be authorized by organizational policy through approved registries, and have credentials managed securely (not embedded in config files). Plain HTTP exposes data in transit, and disabling CORS removes an important cross-origin security boundary."},

{id:"3-12",examId:3,domain:2,type:"mc",
question:"An agent running in a GitHub Actions workflow needs to interact with both the GitHub API and an external Jira MCP server. The Copilot cloud agent firewall is enabled. What configuration is needed?",
options:[
"No configuration needed; the firewall allows all traffic by default",
"Add both github.com and the Jira MCP server's domain to the firewall's allowed list so the agent can reach both services",
"Disable the firewall entirely to allow external connections",
"Route all traffic through a VPN tunnel instead of using the firewall"
],correct:1,
explanation:"The Copilot cloud agent firewall restricts outbound network access by default. To allow the agent to reach specific external services, their domains must be explicitly added to the firewall's allowed list. This maintains the principle of least privilege for network access — the agent can only reach the services it needs, nothing more."},

{id:"3-13",examId:3,domain:2,type:"mc",
question:"A team discovers that their MCP tool calls occasionally return stale data because the external service caches responses. How should the agent handle this?",
options:[
"Ignore the caching issue since it only affects some calls",
"Implement cache-busting strategies where supported (unique request parameters), add freshness validation by cross-referencing data from multiple sources, and document the known staleness window in the agent's instructions",
"Always retry every MCP call three times",
"Replace the MCP tool with direct API calls"
],correct:1,
explanation:"A comprehensive approach addresses the caching issue at multiple levels: cache-busting prevents stale responses where possible, cross-referencing validates freshness through independent sources, and documenting the staleness window in instructions helps the agent reason about data reliability. Blind retries don't bypass caches, and direct API calls don't solve the upstream caching issue."},

{id:"3-14",examId:3,domain:2,type:"scenario",
scenario:"You are troubleshooting an agent that fails when trying to create a branch in a GitHub repository. The error log shows:\n\nMCP tool: github/create_branch\nStatus: 422 Unprocessable Entity\nResponse: {\"message\":\"Reference already exists\"}",
question:"What is the cause and the correct fix?",
options:[
"The repository is corrupted. Delete and recreate it.",
"The agent is trying to create a branch with a name that already exists. The agent should check for existing branches before creating, and either use the existing branch or generate a unique branch name.",
"The GitHub API is down. Wait and retry.",
"The agent's authentication token has expired. Refresh the token."
],correct:1,
explanation:"A 422 'Reference already exists' error means the branch name the agent is trying to create already exists. The fix is to add a pre-check: verify if the branch exists, and if so, either use the existing branch or generate a unique name (e.g., append a timestamp or counter). This is a common error in agents that run repeatedly on the same repository."},

{id:"3-15",examId:3,domain:2,type:"mc",
question:"What is the significance of CORS requirements in the MCP registry specification?",
options:[
"CORS is only required for aesthetic reasons in the registry UI",
"CORS headers allow web-based MCP clients (like VS Code's web version or GitHub's web UI) to discover and connect to registry endpoints across different origins, which is necessary for browser-based environments",
"CORS prevents MCP servers from communicating with each other",
"CORS is not related to MCP registries"
],correct:1,
explanation:"CORS (Cross-Origin Resource Sharing) headers are required so that browser-based clients can make requests to MCP registry endpoints from a different origin. Without CORS support, web-based development environments would be unable to discover available MCP servers from the registry, breaking tool discovery in browser-based workflows."},

{id:"3-16",examId:3,domain:2,type:"mc",
question:"An agent is configured with access to 15 MCP tools but consistently only uses 3 of them. The other 12 tools consume space in the agent's context. What optimization should be considered?",
options:[
"Remove all unused tools immediately",
"Implement lazy tool loading where the agent starts with a minimal tool set and additional tools are loaded on demand when the agent's task requires them",
"Increase the context window size to accommodate all 15 tools",
"Disable MCP entirely and hard-code the 3 tools"
],correct:1,
explanation:"Lazy tool loading reduces context consumption by starting with only the tools most likely to be needed. Additional tools are loaded on demand when the agent's task analysis identifies a need. This optimizes context window usage while maintaining access to the full tool set. Removing tools may be premature, and increasing the context window is wasteful."},

{id:"3-17",examId:3,domain:2,type:"mc",
question:"Which factor should MOST influence the decision between using a local MCP server (stdio) versus a remote MCP server (HTTP)?",
options:[
"Local servers are always faster",
"Whether the tool requires access to local filesystem resources (favoring stdio) or provides a shared service that multiple users access (favoring HTTP)",
"Remote servers are always more reliable",
"The programming language the server is written in"
],correct:1,
explanation:"The primary decision factor is the tool's resource requirements. Local stdio servers are appropriate when the tool needs access to local files, development environment state, or user-specific resources. Remote HTTP servers are appropriate for shared services (CI/CD, issue trackers, shared databases) that multiple users or agents access from different environments."},

{id:"3-18",examId:3,domain:2,type:"ms",
question:"Select TWO scenarios where an agent should escalate to a human rather than attempting automated recovery.",
options:[
"A transient network timeout that resolves on retry",
"The agent's proposed fix would require modifying a file it doesn't have write permission to, and the modification involves changing security-critical authentication logic",
"A unit test fails because the agent made a typo in a variable name",
"The agent detects that its task requires deleting a production database table that is referenced by 15 other services"
],correct:[1,3],
explanation:"Both scenarios involve high-risk situations that exceed the agent's authorized scope. Modifying security-critical authentication logic without permission requires human authorization. Deleting a production database table with 15 downstream dependencies is an irreversible high-impact action that demands human review. Typos and transient timeouts are routine issues the agent can handle."},

{id:"3-19",examId:3,domain:2,type:"mc",
question:"What is the role of the 'tools' property in a GitHub Actions workflow that uses Copilot agents?",
options:[
"It lists the programming languages used in the repository",
"It specifies which MCP tools the agent is allowed to use during the workflow execution, enabling per-workflow tool scoping",
"It defines the Docker containers used by the workflow",
"It configures the agent's context window size"
],correct:1,
explanation:"The tools property in a workflow configuration specifies which MCP tools are available to the agent during that specific workflow run. This enables per-workflow tool scoping — a deployment workflow might have access to deployment tools, while a code review workflow has access to analysis tools. This follows the principle of least privilege at the workflow level."},

{id:"3-20",examId:3,domain:2,type:"mc",
question:"An organization wants to track which MCP tools are being used most frequently by their agents. Which approach provides this visibility?",
options:[
"Ask developers to manually log their tool usage",
"Implement observability at the MCP client level that logs tool invocations, parameters, response times, and success/failure rates, then aggregate these metrics in a monitoring dashboard",
"Count the number of MCP servers in the registry",
"Check the MCP server's README files for usage statistics"
],correct:1,
explanation:"Client-level observability that logs all MCP tool invocations provides real usage data: which tools are called, how often, with what parameters, how long they take, and how often they fail. This data informs decisions about tool investment, deprecation, performance optimization, and capacity planning."},

{id:"3-54",examId:3,domain:2,type:"scenario",
scenario:"An enterprise is standardizing how teams extend Copilot Chat. Team A built a Skillset extension that exposes their feature-flag service. Team B built an Agent extension that manages complex infrastructure provisioning conversations. Team C wants to add a simple lookup tool for their internal employee directory.",
question:"Which pattern should Team C follow, and why?",
options:[
"Agent extension — all new Copilot Extensions should use the Agent type for consistency",
"Skillset extension — the employee directory is a straightforward API lookup with no need for custom conversation management, matching Team A's pattern rather than Team B's more complex Agent approach",
"Neither — they should build an MCP server instead, since Copilot Extensions are deprecated",
"They should wait for Team B to extend their Agent extension to include the directory lookup"
],correct:1,
explanation:"The decision between Agent and Skillset depends on the complexity of the interaction. A simple directory lookup (structured API call, no multi-turn conversation, no custom response formatting) is a textbook Skillset use case. The platform handles prompt crafting and function evaluation, minimizing development effort. Team B's Agent extension was justified by their need for multi-turn conversation management and custom processing — complexity Team C does not have."},

{id:"3-55",examId:3,domain:2,type:"ms",
question:"Select TWO correct statements about the difference between Copilot Extension Agents and Copilot Extension Skillsets.",
options:[
"Agent extensions handle their own request processing, response generation, and conversation context management",
"Skillset extensions can route requests to a custom LLM hosted by the developer",
"Skillset extensions define API endpoints while the Copilot platform handles prompt crafting and function evaluation",
"Agent extensions are limited to read-only operations and cannot modify data"
],correct:[0,2],
explanation:"Agent extensions give the developer full control over the request lifecycle: they process incoming requests, manage conversation context, generate responses, and can route to any LLM. Skillset extensions take the opposite approach: the developer defines API endpoints and the platform handles everything else (prompt crafting, function evaluation, routing). Skillsets cannot route to custom LLMs — that is an Agent capability. Neither type is limited to read-only operations."},

{id:"3-56",examId:3,domain:2,type:"scenario",
scenario:"A developer creates a .github/skills/deploy-checker/ folder in their repository containing a skill definition that validates deployment readiness. They also have a personal skill in ~/.copilot/skills/code-review-style/ that enforces their preferred review conventions. A colleague clones the same repository.",
question:"Which skills will the colleague's Copilot agent have access to?",
options:[
"Both the deploy-checker and code-review-style skills, since they share the repository",
"Only the deploy-checker skill — project skills in .github/skills/ travel with the repository, while personal skills in ~/.copilot/skills/ are local to the original developer's machine",
"Neither skill — Agent Skills require explicit installation via a package manager",
"Only the code-review-style skill, since personal skills take precedence"
],correct:1,
explanation:"Agent Skills in project directories (.github/skills/, .claude/skills/, .agents/skills/) are part of the repository and available to anyone who clones it. Personal skills in ~/.copilot/skills/ are local to the individual developer's machine and do not travel with the repository. This separation allows teams to share project-specific skills through version control while letting individuals maintain personal workflow customizations."},

{id:"3-57",examId:3,domain:2,type:"mc",
question:"A team is deciding between building a Copilot Extension and deploying an MCP server for their internal CI/CD dashboard. The tool needs to be available to 200 developers across the organization without requiring individual IDE configuration. Which approach better fits this requirement?",
options:[
"An MCP server, because MCP is the standard protocol for all tool integrations",
"A Copilot Extension (Agent or Skillset), because it is deployed as a GitHub App and available to all Copilot Chat users via @mention without per-developer IDE configuration",
"Either approach — MCP servers and Copilot Extensions have identical deployment models",
"Neither — they should use a GitHub Action instead"
],correct:1,
explanation:"Copilot Extensions are GitHub Apps deployed centrally and invoked via @mention in Copilot Chat. Once installed for the organization, all 200 developers can use them without touching their IDE settings. MCP servers, by contrast, require per-developer configuration (in VS Code settings, .vscode/mcp.json, or similar) — managing this across 200 developers adds significant overhead. For organization-wide, zero-configuration access, a Copilot Extension is the better deployment model."},

// ── Domain 3: Memory & State (6) ──
{id:"3-21",examId:3,domain:3,type:"scenario",
scenario:"An agent has been working on a complex refactoring task for 2 hours. Its context now contains: the original task description, 30 file reads, 15 edit operations, several error/retry cycles, and conversation messages from 3 different review feedback rounds. The agent is noticeably slower and its responses are becoming less accurate.",
question:"What is happening and what is the correct intervention?",
options:[
"The model's API is rate-limiting the requests. Wait for the limit to reset.",
"The agent is experiencing context window degradation: accumulated state is consuming most of its context, pushing out important information and degrading reasoning. Intervention: compact the context by summarizing completed work, removing error/retry artifacts, and persisting state to external storage (PR description, comments).",
"The agent needs a larger model with a bigger context window.",
"Restart the agent with a clean context and have it start the refactoring from scratch."
],correct:1,
explanation:"This is context window degradation — the accumulation of operational artifacts (reads, edits, errors, retries) has consumed the available context space, crowding out the information the agent needs for accurate reasoning. The correct intervention is context compaction: summarize completed work, remove transient artifacts, and persist state externally. Restarting from scratch wastes 2 hours of work."},

{id:"3-22",examId:3,domain:3,type:"mc",
question:"How can an agent detect its own context drift?",
options:[
"Context drift is undetectable by the agent itself",
"The agent can periodically re-read key state sources (current file contents, issue status, branch state) and compare against its internal assumptions, flagging discrepancies",
"Context drift only occurs when the model is updated",
"The agent detects context drift by monitoring its own token count"
],correct:1,
explanation:"An agent can detect context drift by implementing periodic state validation: re-reading the actual state of key resources (files, issues, branches) and comparing against what it believes the state to be. When discrepancies are found, the agent knows its context has drifted and can refresh its understanding before continuing."},

{id:"3-23",examId:3,domain:3,type:"mc",
question:"A team stores agent task state in GitHub issues using a structured format in the issue body. When an agent resumes a task, it reads the issue to reconstruct its state. What is the PRIMARY advantage of this approach over storing state in the agent's own memory?",
options:[
"Issue bodies have unlimited storage capacity",
"The state persists independently of the agent's session, is visible to humans, can be audited, and survives agent restarts or context window resets",
"Issues are faster to read than the agent's own memory",
"GitHub issues have built-in encryption for sensitive state"
],correct:1,
explanation:"Storing state in GitHub issues provides durable persistence (survives agent restarts), transparency (humans can inspect the state), auditability (issue edit history shows state changes over time), and session independence (a different agent instance or model can resume the task by reading the issue). These properties make it superior to in-memory state for resumable tasks."},

{id:"3-24",examId:3,domain:3,type:"ms",
question:"Select TWO techniques for managing memory in a long-running agent that processes 100+ files.",
options:[
"Summarize completed file batches into compact summaries stored in durable external storage, keeping only the current working batch in context",
"Load all 100+ files into the context window simultaneously for maximum awareness",
"Implement a priority queue that loads files based on relevance to the current sub-task, evicting completed or low-relevance files",
"Disable memory management to avoid the overhead of summarization"
],correct:[0,2],
explanation:"Batch summarization keeps the context window manageable by compacting completed work into summaries stored externally. A priority-based loading queue ensures the most relevant files are in context at any time, automatically managing context window capacity. Loading all files at once would overflow the window, and disabling management guarantees degradation."},

{id:"3-25",examId:3,domain:3,type:"mc",
question:"What role do commit messages play as a form of agent memory?",
options:[
"Commit messages have no value as agent memory",
"They serve as a durable, sequential record of what changes were made and why, enabling any future agent (or human) to reconstruct the history and rationale of a task from the Git log",
"Commit messages are only useful for human developers",
"Commit messages are too short to contain meaningful information"
],correct:1,
explanation:"Well-written commit messages are a powerful form of durable memory. They capture what changed and why in a sequential, immutable log. Future agents can read the commit history to understand the evolution of a feature, the reasoning behind design decisions, and the context that informed past changes. This makes Git itself a knowledge base."},

{id:"3-26",examId:3,domain:3,type:"mc",
question:"An agent is configured with copilot-instructions.md that says 'Always check the CHANGELOG before modifying version numbers.' During a long session, the agent stops checking the CHANGELOG and begins incrementing versions based on its own assumptions. What happened?",
options:[
"The copilot-instructions.md was deleted mid-session",
"The persistent instruction was pushed out of the agent's effective context window by accumulated session state, causing the agent to 'forget' the behavioral rule — a form of context window capacity issue",
"The agent intentionally decided the instruction was unnecessary",
"This scenario is impossible if copilot-instructions.md is configured correctly"
],correct:1,
explanation:"As session state accumulates, earlier content (including copilot-instructions.md) can be pushed out of the model's effective attention, causing behavioral rules to be 'forgotten.' This is a context capacity issue, not intentional defiance. Mitigations include periodic re-injection of critical instructions, context compaction, and monitoring for behavioral drift."},

// ── Domain 4: Evaluation & Tuning (9) ──
{id:"3-27",examId:3,domain:4,type:"scenario",
scenario:"A team deploys an agent that reviews pull requests for a security-sensitive application. After 3 months of operation, they collect this data:\n- 500 PRs reviewed\n- 45 true security issues identified and flagged (true positives)\n- 120 non-issues flagged as security concerns (false positives)\n- 8 actual security issues that the agent missed (false negatives)\n- Average review time: 3 minutes per PR (vs. 45 minutes for human review)",
question:"How should the team evaluate this agent's effectiveness?",
options:[
"The agent is excellent — it reviews 15x faster than humans",
"The agent is terrible — it has 120 false positives",
"Evaluate holistically: precision is 45/(45+120) = 27% (too many false positives), recall is 45/(45+8) = 85% (catching most real issues). The speed is valuable but the low precision erodes developer trust. Tune to improve precision while maintaining high recall.",
"The 8 missed issues make the agent unacceptable. Remove it immediately."
],correct:2,
explanation:"Comprehensive evaluation considers multiple signals. High recall (85%) means the agent catches most real issues — good for security. Low precision (27%) means too many false positives — this erodes developer trust and wastes review time. The tuning target is clear: reduce false positives (improve precision) while maintaining high recall. Speed is a valuable secondary benefit. Neither pure speed nor a single metric tells the full story."},

{id:"3-28",examId:3,domain:4,type:"mc",
question:"What is the difference between evaluating an agent's individual output quality versus evaluating its end-to-end workflow effectiveness?",
options:[
"There is no difference; if individual outputs are good, the workflow must be effective",
"Individual output quality measures whether each step's result is correct and useful; workflow effectiveness measures whether the entire chain of steps achieves the intended goal within time, cost, and quality constraints",
"Individual output is evaluated by automated tools; workflow effectiveness is evaluated only by humans",
"Workflow effectiveness only matters for multi-agent systems"
],correct:1,
explanation:"An agent might produce high-quality individual outputs (each PR is well-written) but have poor workflow effectiveness (it takes 20 PRs to implement a feature that should take 3, or it creates PRs in the wrong order, or it misses the overall architecture). End-to-end evaluation assesses whether the complete workflow achieves its goal efficiently and correctly."},

{id:"3-29",examId:3,domain:4,type:"ms",
question:"Select THREE valid root cause categories for agent task failures.",
options:[
"Reasoning error — the agent's logical analysis of the problem was flawed",
"Tool misuse — the agent selected or invoked tools incorrectly",
"Context issue — the agent lacked, had stale, or had excessive information",
"Hardware failure — the server running the model crashed",
"User preference — the user didn't like the agent's coding style"
],correct:[0,1,2],
explanation:"The three core root cause categories for agent failures are: reasoning errors (flawed logic or understanding), tool misuse (incorrect tool selection or invocation), and context issues (missing, stale, or excessive information). Hardware failure is an infrastructure issue (not agent-specific), and style preference is a tuning concern, not a failure."},

{id:"3-30",examId:3,domain:4,type:"mc",
question:"A team notices that their agent's code generation quality drops significantly when the input prompt exceeds 2000 tokens. What evaluation insight does this provide?",
options:[
"The model needs to be fine-tuned with longer prompts",
"This reveals a prompt sensitivity issue — the agent's performance degrades with prompt length, suggesting that tuning efforts should focus on prompt structure (breaking long prompts into structured sections) and context management (prioritizing the most important information early in the prompt)",
"The model's maximum context window is 2000 tokens",
"This is expected behavior and no action is needed"
],correct:1,
explanation:"Identifying performance degradation at specific prompt lengths is a valuable evaluation insight. It indicates prompt sensitivity that can be addressed through structural improvements: organizing prompts with the most critical information first, using structured sections (context, task, constraints), and implementing prompt engineering best practices. This is a tuning opportunity, not a model limitation."},

{id:"3-31",examId:3,domain:4,type:"scenario",
scenario:"An agent generates database migration scripts. The evaluation pipeline includes: (1) SQL syntax validation, (2) Schema compatibility check against the current database, (3) Automated rollback verification — ensuring every migration has a corresponding down migration. Recently, a migration passed all three checks but caused a production outage because it locked a critical table for 15 minutes during a high-traffic period.",
question:"What evaluation gap does this reveal, and how should it be addressed?",
options:[
"The SQL syntax validation is broken. Replace the validator.",
"The evaluation pipeline lacks a performance impact assessment. Add a check that estimates query execution time and lock duration on representative data volumes, and flag migrations that could cause extended table locks during peak hours.",
"The automated rollback verification should have caught this. Make it stricter.",
"This is an operational concern, not an evaluation concern. Handle it with monitoring only."
],correct:1,
explanation:"The evaluation pipeline validated correctness (syntax, compatibility, rollback) but not operational impact (performance, locking, timing). The gap is performance impact assessment — evaluating whether a correct migration can be safely executed in a production context with real data volumes and traffic patterns. Adding this check prevents correct-but-dangerous migrations from reaching production."},

{id:"3-32",examId:3,domain:4,type:"mc",
question:"How should evaluation criteria evolve as an agent matures and handles more complex tasks?",
options:[
"Evaluation criteria should remain fixed to ensure consistent measurement over time",
"Evaluation criteria should expand progressively: starting with correctness baselines, adding quality metrics as correctness stabilizes, then adding efficiency and style metrics as quality improves",
"Evaluation criteria should become simpler over time as the agent improves",
"Evaluation criteria are only needed during the initial deployment phase"
],correct:1,
explanation:"Evaluation maturity should match agent maturity. Early on, the priority is correctness — does the agent produce working results? Once correctness is stable, add quality metrics — are the results well-designed? Then add efficiency and style metrics — are the results elegant, performant, and idiomatic? This progressive approach avoids overwhelming early evaluation with premature optimization."},

{id:"3-33",examId:3,domain:4,type:"mc",
question:"What is the value of comparing an agent's execution trace against its planning artifact?",
options:[
"It has no value; traces and plans serve different purposes",
"It enables detection of plan adherence (did the agent follow its plan?), adaptive deviation (did it productively adjust?), and drift/failure (did it deviate harmfully?), providing critical insight for both current task evaluation and future tuning",
"It is only useful for billing purposes",
"It is only relevant for multi-agent systems"
],correct:1,
explanation:"Plan-vs-trace comparison is a powerful evaluation technique. It reveals: plan adherence (the agent followed its plan — good), adaptive deviation (the agent improved on its plan based on new information — potentially good), and harmful drift (the agent deviated for no good reason — needs tuning). This analysis informs both immediate task evaluation and long-term agent improvement."},

{id:"3-34",examId:3,domain:4,type:"mc",
question:"An organization tracks these metrics for their fleet of agents: tasks completed per day, average task duration, failure rate, human escalation rate, and user satisfaction score. Which metric combination BEST indicates the need for tuning?",
options:[
"Low failure rate with high user satisfaction — the agent is working well",
"High task completion with low user satisfaction — the agent completes tasks but the quality is insufficient for users",
"Low task completion with low failure rate — the agent is cautious but not productive",
"High failure rate with high escalation rate — the agent correctly recognizes its limitations"
],correct:1,
explanation:"High completion with low satisfaction is the most concerning combination because it suggests the agent is producing outputs that meet automated checks but fail qualitative assessment. Users are unhappy with the results despite the agent 'succeeding' by automated metrics. This indicates a gap between what's being measured and what users actually value — the core tuning signal."},

{id:"3-35",examId:3,domain:4,type:"mc",
question:"How does the concept of 'evaluation alignment with development intent' differ from simply checking if tests pass?",
options:[
"They are the same thing",
"Development intent captures the purpose and vision behind a change (why it's being made, what it should achieve for users), while test pass rates only verify that code behaves as specified in the test cases — intent is broader than specification",
"Development intent only matters for new features, not bug fixes",
"Test pass rates are always a better indicator than development intent"
],correct:1,
explanation:"Development intent is the 'why' behind a change — the user need, the architectural goal, the business outcome. Tests verify the 'what' — specific behavioral specifications. An agent can produce code that passes all tests but misses the intent (e.g., implementing a feature correctly but with terrible UX, or fixing a bug but introducing technical debt). Evaluation alignment means checking both levels."},

// ── Domain 5: Multi-Agent Systems (9) ──
{id:"3-36",examId:3,domain:5,type:"scenario",
scenario:"A company runs a multi-agent system with: Agent A (code generation), Agent B (code review), Agent C (test generation), and Agent D (deployment). During a production incident, the investigation reveals:\n- Agent A generated code with a subtle race condition\n- Agent B reviewed the code but did not catch the race condition\n- Agent C generated tests that didn't cover the concurrent execution path\n- Agent D deployed the code to production after all checks passed",
question:"What systemic improvement would BEST prevent this class of failure?",
options:[
"Replace all agents with a single more capable agent",
"Replace Agent B with a human reviewer",
"Add concurrency-specific evaluation: instruct Agent B to check for race conditions explicitly, add concurrent test scenarios to Agent C's mandate, and create an Agent E (concurrency analyzer) that runs specialized static analysis for concurrency issues before Agent D deploys",
"Add more unit tests"
],correct:2,
explanation:"The failure was systemic — each agent's gap compounded. The fix is systemic too: update Agent B's instructions to explicitly check for concurrency, expand Agent C's test generation to include concurrent scenarios, and add a specialized Agent E for concurrency analysis. This defense-in-depth approach means the race condition would need to evade multiple specialized checks to reach production."},

{id:"3-37",examId:3,domain:5,type:"mc",
question:"What is the PRIMARY challenge of post-hoc analysis in multi-agent systems compared to single-agent systems?",
options:[
"Multi-agent logs are larger",
"Causality is distributed: the root cause may span multiple agents' decision chains, and understanding the failure requires reconstructing the temporal sequence of inter-agent actions and the data that flowed between them",
"Multi-agent systems don't produce logs",
"Post-hoc analysis is equally difficult for both"
],correct:1,
explanation:"In multi-agent systems, causality is distributed across agents. A failure visible in Agent D may have originated from a decision in Agent A, passed through Agent B's review, and been amplified by Agent C's test gaps. Post-hoc analysis requires reconstructing the full temporal sequence across all agents and the data that flowed between them — a fundamentally harder problem than tracing a single agent's execution."},

{id:"3-38",examId:3,domain:5,type:"mc",
question:"When should an organization consider retiring an agent from a multi-agent system?",
options:[
"Only when the agent starts producing errors",
"When the agent's role has been made redundant by other system changes, when its maintenance cost exceeds its value, when its capabilities no longer match the system's evolved requirements, or when it introduces more coordination overhead than it resolves",
"Agents should never be retired once deployed",
"Only when a direct replacement agent is available"
],correct:1,
explanation:"Agent retirement should be considered when the agent no longer provides net value: its role may be redundant (another tool or agent covers it), its maintenance cost may exceed its contribution, the system may have evolved beyond its capabilities, or it may create more coordination overhead than it resolves. These are all valid triggers independent of whether errors occur."},

{id:"3-39",examId:3,domain:5,type:"ms",
question:"Select TWO critical steps when retiring an agent from a multi-agent system.",
options:[
"Immediately delete all of the agent's configuration and logs",
"Verify that no other agents or workflows depend on the retiring agent's outputs before removing it",
"Preserve the agent's execution history and audit trail for compliance and future reference",
"Transfer the agent's permissions to a random remaining agent"
],correct:[1,2],
explanation:"Before retiring an agent: verify no dependencies exist (other agents or workflows that consume its outputs would break), and preserve the audit trail (compliance requirements often mandate retention of automated decision records). Deleting logs destroys accountability, and randomly transferring permissions violates least privilege."},

{id:"3-40",examId:3,domain:5,type:"mc",
question:"In a hierarchical multi-agent system, what happens when the supervisor agent fails?",
options:[
"All subordinate agents continue operating normally since they are independent",
"The system loses coordination: subordinate agents may continue their current tasks but cannot receive new tasks, cannot be re-directed, and have no failure recovery oversight — requiring a fallback mechanism such as a backup supervisor or human escalation",
"Subordinate agents automatically elect a new supervisor",
"The system is completely unaffected since the supervisor only monitors metrics"
],correct:1,
explanation:"The supervisor is the coordination nexus. Without it, subordinates lose direction: no new task assignment, no inter-agent coordination, no failure recovery, no result aggregation. The system should have a fallback plan: a backup supervisor, automatic human escalation when the supervisor is unresponsive, or subordinate agents entering a safe mode where they complete current work but accept no new tasks."},

{id:"3-41",examId:3,domain:5,type:"scenario",
scenario:"Two agents in a parallel workflow both attempt to modify the same configuration file. Agent X adds a new database connection string. Agent Y updates the logging level. They create separate branches and PRs. When both PRs are merged, the second merge overwrites the first agent's changes.",
question:"What coordination mechanism would prevent this conflict?",
options:[
"Make the agents work sequentially instead of in parallel",
"Implement a file-level locking mechanism or coordination protocol: before modifying shared files, an agent must acquire an advisory lock, check for pending changes by other agents, and either wait, rebase, or merge with the other agent's changes before creating its PR",
"Give only one agent permission to modify configuration files",
"Remove the configuration file from version control"
],correct:1,
explanation:"A coordination protocol for shared resources prevents merge conflicts. Advisory locking, pending-change checks, and rebase/merge strategies ensure agents are aware of concurrent modifications. Sequential execution solves the problem but sacrifices parallelism. Single-agent restriction is too limiting for independent concerns like database config and logging config."},

{id:"3-42",examId:3,domain:5,type:"mc",
question:"What is an 'emergent behavior' in a multi-agent system?",
options:[
"A behavior that was explicitly programmed into each agent",
"A system-level behavior that arises from the interaction of multiple agents but was not explicitly designed into any individual agent, which can be either beneficial or harmful",
"A behavior that only appears during testing but not in production",
"A behavior caused by a bug in the orchestration framework"
],correct:1,
explanation:"Emergent behaviors arise from agent interactions and cannot be predicted from examining any single agent in isolation. They can be positive (agents developing efficient division of labor) or negative (agents entering deadlock, creating feedback loops, or systematically avoiding certain tasks). Detecting emergent behaviors requires system-level observability and monitoring."},

{id:"3-43",examId:3,domain:5,type:"mc",
question:"How should observability be structured in a multi-agent system to enable effective debugging?",
options:[
"Each agent logs to its own isolated log file with no common identifiers",
"Implement distributed tracing with correlation IDs that follow a task across all agents, enabling reconstruction of the complete task lifecycle from initiation through all agent interactions to completion",
"Only the supervisor agent needs logging; subordinates don't generate useful logs",
"Observability is not needed if the agents have good instructions"
],correct:1,
explanation:"Distributed tracing with correlation IDs is essential. A unique task ID follows the work as it flows from agent to agent, enabling operators to query for that ID and see the complete lifecycle: which agents touched it, in what order, with what inputs/outputs, and where issues arose. Without correlation IDs, debugging multi-agent failures requires manually stitching together isolated logs — a labor-intensive and error-prone process."},

{id:"3-44",examId:3,domain:5,type:"mc",
question:"A multi-agent system uses a coordinator that distributes tasks to worker agents. The coordinator becomes a bottleneck as the number of concurrent tasks increases. What architectural improvement addresses this?",
options:[
"Add more worker agents to handle the load",
"Implement a decentralized coordination pattern using a shared task queue (e.g., backed by a message broker) where workers pull tasks independently, reducing reliance on a single coordinator and enabling horizontal scaling",
"Increase the coordinator's context window to handle more tasks simultaneously",
"Reduce the number of tasks to match the coordinator's capacity"
],correct:1,
explanation:"Replacing a centralized coordinator bottleneck with a decentralized task queue allows horizontal scaling. Workers independently pull tasks from the queue, eliminating the single point of bottleneck. The coordinator can still exist for high-level orchestration, but task distribution becomes a scalable infrastructure concern rather than an agent-level limitation."},

// ── Domain 6: Guardrails & Safety (8) ──
{id:"3-45",examId:3,domain:6,type:"scenario",
scenario:"A financial services company is deploying agents that can read production database queries for debugging purposes. Compliance requires: (1) All data access must be logged, (2) PII must not be displayed in agent outputs, (3) Access must be revocable within 1 hour, (4) A quarterly audit trail must be available.",
question:"Which guardrail architecture satisfies all four compliance requirements?",
options:[
"Give agents direct database credentials with verbose logging enabled",
"Implement a database proxy layer that: logs all queries to an audit store (req 1), redacts PII fields in query results before returning to the agent (req 2), uses short-lived tokens revocable via a central control plane (req 3), and exports the audit log for quarterly review (req 4)",
"Restrict agents to read-only access and rely on the database's built-in audit logging",
"Manually review each agent query before execution"
],correct:1,
explanation:"The database proxy architecture satisfies all four requirements with automation. It interposes between the agent and the database, providing: centralized query logging, PII redaction at the proxy level (preventing PII from ever reaching the agent), token-based access control with rapid revocation, and structured audit export. Direct credentials bypass redaction and fine-grained control, read-only access doesn't address PII or audit needs, and manual review doesn't scale."},

{id:"3-46",examId:3,domain:6,type:"ms",
question:"Select THREE guardrails that should be applied when an agent has the ability to create GitHub releases.",
options:[
"Require signed commits on the release branch to verify the integrity of all included changes",
"Require approval from designated release managers (via CODEOWNERS or required reviewers) before the release is published",
"Allow the agent to release directly to production without any checks, since release frequency improves development velocity",
"Require all CI checks (tests, security scans, build verification) to pass before the release is created",
"Disable branch protection on the release branch for faster releases"
],correct:[0,1,3],
explanation:"Releases are high-impact events that need layered guardrails. Signed commits verify code integrity and provenance. Required approvals from release managers ensure human oversight of what ships. Passing CI checks verify quality gates. Removing protections or checks for speed undermines safety at the most critical point — what reaches users."},

{id:"3-47",examId:3,domain:6,type:"mc",
question:"An agent has been configured with Level 2 autonomy. During execution, it encounters a task that it believes would be more efficiently handled at Level 3 autonomy. What should the agent do?",
options:[
"Automatically escalate its own autonomy level to Level 3 for this task",
"Continue operating at Level 2, escalate the decision to a human, and document why it believes Level 3 would be more appropriate for potential future policy revision",
"Ignore the autonomy constraint and complete the task however it sees fit",
"Refuse to perform the task entirely"
],correct:1,
explanation:"An agent should never unilaterally escalate its own autonomy level. Autonomy levels are set by humans based on organizational risk assessment. The agent should operate within its assigned level, escalate to a human with its reasoning, and let humans decide whether to adjust the policy. Self-escalation of authority is a fundamental safety violation."},

{id:"3-48",examId:3,domain:6,type:"mc",
question:"How do GitHub rulesets differ from traditional branch protection rules, and why does this matter for agent guardrails?",
options:[
"There is no meaningful difference between rulesets and branch protection",
"Rulesets provide more granular, composable, and targetable protection policies that can be applied across multiple branches and repositories, with bypass permissions and conditions — giving organizations finer-grained control over agent behavior than traditional branch protection",
"Rulesets replace branch protection entirely and cannot be used alongside it",
"Rulesets only apply to enterprise-tier GitHub accounts"
],correct:1,
explanation:"Rulesets are more flexible than traditional branch protection: they can target multiple branches via patterns, be applied across repositories, include bypass permissions for specific roles, and compose multiple rules. For agent guardrails, this means organizations can create nuanced policies like 'agents can push to feature branches but not release branches, and senior agents can bypass code review for documentation changes.'"},

{id:"3-49",examId:3,domain:6,type:"scenario",
scenario:"A team runs an agent that automatically closes stale issues (no activity for 90 days). A user complains that the agent closed their issue, which was blocked waiting for an upstream dependency and had intentionally been left open. The issue had a 'blocked' label.",
question:"What guardrail should be added to prevent this from happening again?",
options:[
"Increase the staleness threshold from 90 to 180 days",
"Add an exclusion rule to the agent's instructions: do not close issues with 'blocked,' 'on-hold,' or 'waiting-upstream' labels, regardless of inactivity duration. Additionally, the agent should comment on candidate issues before closing them, giving a grace period for objections.",
"Remove the agent entirely and let humans manage issue cleanup",
"Make the agent require approval for every issue closure"
],correct:1,
explanation:"The guardrail should be label-aware exclusion (respecting semantic signals that indicate intentional inactivity) plus a grace period (commenting before closing, giving stakeholders time to object). Simply increasing the threshold doesn't fix the fundamental issue — some issues are legitimately inactive for long periods. Requiring approval for every closure defeats the automation's purpose."},

{id:"3-50",examId:3,domain:6,type:"mc",
question:"What is the relationship between the principle of least privilege and blast radius in agent security?",
options:[
"They are unrelated concepts",
"Least privilege directly controls blast radius: by limiting an agent's permissions to only what it needs, the maximum damage it can cause (intentionally or accidentally) is bounded to those permissions, containing the blast radius of any failure or compromise",
"Least privilege increases blast radius by restricting the agent's recovery options",
"Blast radius only applies to multi-agent systems, while least privilege applies to all agents"
],correct:1,
explanation:"Least privilege is the primary mechanism for controlling blast radius. An agent with only contents:read permission for one repository can, at worst, read files from that repository — that's the blast radius. An agent with admin:org permission could potentially modify any repository, manage teams, and change organization settings — a massive blast radius. Restricting permissions directly bounds the maximum possible damage."},

{id:"3-51",examId:3,domain:6,type:"mc",
question:"A security audit reveals that an agent has been using a personal access token (PAT) with admin scope that was created 18 months ago. What security guardrail failures does this represent?",
options:[
"No failure — long-lived PATs are standard practice for agents",
"Two failures: violation of least privilege (admin scope is excessive for most agent tasks) and lack of credential rotation (18 months without rotation significantly increases the risk of compromise)",
"One failure: the token should have been a GitHub App token instead",
"Three failures: wrong scope, no rotation, and the token should be stored in a database"
],correct:1,
explanation:"This represents two clear guardrail failures. Least privilege violation: admin scope grants far more access than any single agent task should require. Credential hygiene failure: 18-month-old tokens have had extensive exposure time and should have been rotated according to a regular schedule. The fix is to replace the PAT with a minimally-scoped token and implement automated rotation."},

{id:"3-52",examId:3,domain:6,type:"mc",
question:"Why should guardrails be tested and verified, not just configured?",
options:[
"Testing guardrails is unnecessary if they are configured correctly",
"Configuration alone doesn't guarantee enforcement: guardrails can be misconfigured, circumvented by edge cases, or rendered ineffective by system changes. Regular testing verifies that guardrails actually prevent the behaviors they were designed to block.",
"Guardrails are self-testing once enabled",
"Testing guardrails wastes engineering time that could be spent on features"
],correct:1,
explanation:"Configuration is intent; testing is verification. A branch protection rule might be configured but not applied to the correct branch pattern. A CODEOWNERS file might have a typo that causes it to not match the intended paths. System changes might create new code paths that bypass existing guardrails. Regular testing (including adversarial testing) verifies that guardrails actually work in practice, not just in theory."}

];
