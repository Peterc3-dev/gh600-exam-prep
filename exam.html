<style>
  /* ── Exam Selection Screen ── */
  .exam-hero {
    text-align: center;
    padding: 3rem 2rem 1rem;
  }
  .exam-hero h1 { margin-bottom: 0.5rem; }

  .exam-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    max-width: 1100px;
    margin: 2rem auto;
  }

  .exam-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.75rem;
    transition: all 0.3s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .exam-card:hover {
    border-color: var(--green-dim);

    box-shadow: 0 0 30px var(--green-glow);

  }
  .exam-card .exam-number {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }
  .exam-card h3 { margin-bottom: 0.5rem; }
  .exam-card .exam-meta {
    display: flex;
    gap: 1rem;
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-bottom: 1rem;
  }
  .exam-card .exam-desc {
    font-size: 0.85rem;

  }
  .exam-card .best-score {

    padding: 0.4rem 0.75rem;

  .exam-card .best-score.pass { color: var(--green); border: 1px solid var(--green-dim); }
  .exam-card .best-score.fail { color: var(--red); border: 1px solid var(--red-dim); }

  .mode-btn {

  .review-result-badge.correct { background: var(--green-glow); color: var(--green); }
  .review-result-badge.incorrect { background: rgba(255,68,68,0.15); color: var(--red); }

  /* ── Confirm Modal ── */
  .confirm-modal {
    text-align: center;
  }
  .confirm-modal p { color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.9rem; }
  .confirm-modal .stats-row {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin: 1.5rem 0;
  }
  .confirm-modal .stat { text-align: center; }
  .confirm-modal .stat .num {
    font-family: var(--font-mono);

  /* ── Print styles ── */

<script>
"use strict";

/* ═══════════════════════════════════════════════════
   QUESTION BANK — 156 QUESTIONS (52 per exam)
   ═══════════════════════════════════════════════════ */

const DOMAIN_NAMES = {
  1: "Architecture & SDLC",
  2: "Tool Use & Environment",
  3: "Memory & State",
  4: "Evaluation & Tuning",
  5: "Multi-Agent Systems",
  6: "Guardrails & Safety"
};

const DOMAIN_COLORS = {
  1: "#00ff41",
  2: "#4488ff",
  3: "#aa66ff",
  4: "#ffcc00",
  5: "#ff8844",
  6: "#ff4444"
};

const QUESTIONS = [

/* ═══════════════════════════════════════
   EXAM 1: "Foundations"
   57 questions
   ═══════════════════════════════════════ */

// ── Domain 1: Architecture & SDLC (10) ──
{id:"1-1",examId:1,domain:1,type:"mc",
question:"What is the fundamental difference between an AI assistant and an AI agent within a software development workflow?",
options:[
"An agent has a larger context window than an assistant",
"An agent can plan, take actions, and evaluate outcomes autonomously, while an assistant only responds when prompted",
"An assistant uses more advanced language models than an agent",
"An agent requires human approval for every action, while an assistant does not"
],correct:1,
explanation:"The defining characteristic of an agent is its ability to operate through a plan-act-evaluate lifecycle, taking autonomous actions toward a goal. An assistant is reactive and responds only to direct prompts without independently pursuing multi-step objectives."},

{id:"1-2",examId:1,domain:1,type:"mc",
question:"Which of the following correctly describes the plan-act-evaluate lifecycle of an AI agent?",
options:[
"The agent receives a prompt, generates a single response, and terminates",
"The agent creates a plan to achieve a goal, executes actions from that plan, evaluates the results, and iterates as needed",
"The agent evaluates all possible solutions before taking any action, then executes the optimal path in a single pass",
"The agent acts first based on heuristics, then creates a plan based on the outcomes"
],correct:1,
explanation:"The agent lifecycle follows plan-act-evaluate in an iterative loop. The agent formulates a plan, takes actions to execute it, evaluates whether the results meet the goal, and refines its approach. This cycle continues until the goal is achieved or the agent determines it cannot proceed."},

{id:"1-3",examId:1,domain:1,type:"ms",
question:"Which TWO of the following are recognized anti-patterns in agentic AI development?",
options:[
"Implementing human-in-the-loop checkpoints at critical decision points",
"Context pollution, where irrelevant information accumulates in the agent's working memory",
"Over-autonomy, where the agent is given more decision-making authority than is appropriate for the risk level",
"Using structured output formats for agent communication"
],correct:[1,2],
explanation:"Context pollution degrades agent performance by flooding its context with irrelevant data, leading to poor decisions. Over-autonomy is dangerous because agents operating beyond appropriate authority levels can cause unintended consequences. Human-in-the-loop and structured outputs are best practices, not anti-patterns."},

{id:"1-4",examId:1,domain:1,type:"mc",
question:"When defining success criteria for an agentic workflow, which element is MOST important to specify upfront?",
options:[
"The specific language model to be used",
"Expected outcomes, operational constraints, and measurable completion criteria",
"The maximum number of API calls the agent can make",
"The formatting style for the agent's output"
],correct:1,
explanation:"Success criteria must define what the agent should achieve (expected outcomes), what boundaries it must respect (operational constraints), and how to determine when the task is complete (measurable completion criteria). These guide both the agent's behavior and the evaluation of its performance."},

{id:"1-5",examId:1,domain:1,type:"mc",
question:"A development team is debating whether their new automated code review system should plan first and then execute, or interleave planning with execution. In which scenario is a plan-first approach MOST appropriate?",
options:[
"When the task involves simple, repetitive file transformations",
"When the task involves multiple dependent steps where early mistakes compound and are costly to reverse",
"When the agent needs to respond to real-time events as they occur",
"When the task scope is unclear and must be discovered during execution"
],correct:1,
explanation:"A plan-first approach is best when tasks have dependent steps and high reversal costs. Planning upfront allows the agent to identify dependencies, allocate resources, and anticipate failure modes before committing to irreversible actions. Interleaved planning suits exploratory or real-time scenarios better."},

{id:"1-6",examId:1,domain:1,type:"mc",
question:"What does 'goal drift' refer to in the context of agentic AI systems?",
options:[
"The agent gradually shifting its objective away from the original goal as it processes more context and makes intermediate decisions",
"The agent completing its goal faster than expected",
"The agent switching from one language model to another during execution",
"The agent losing network connectivity during a long-running task"
],correct:0,
explanation:"Goal drift occurs when an agent gradually moves away from its original objective, often due to accumulated context, ambiguous instructions, or intermediate results that shift the agent's focus. It is a recognized anti-pattern that can be mitigated through clear success criteria and periodic goal re-evaluation."},

{id:"1-7",examId:1,domain:1,type:"mc",
question:"Which autonomy level is MOST appropriate for an agent that generates pull request descriptions from commit history?",
options:[
"Level 0 — No autonomy; human performs all actions manually",
"Level 1 — Agent suggests actions but a human must approve and execute each one",
"Level 2 — Agent executes routine actions autonomously but requires human approval for significant decisions",
"Level 4 — Fully autonomous with no human oversight"
],correct:2,
explanation:"Generating PR descriptions from commit history is a routine task with low risk (the output is a text description, not a code change). Level 2 autonomy allows the agent to perform this automatically while still requiring human approval if the agent encounters unusual situations, such as an ambiguous merge or sensitive file changes."},

{id:"1-8",examId:1,domain:1,type:"mc",
question:"How does the GitHub contributor model apply to AI agents participating in a development workflow?",
options:[
"Agents are given admin access to repositories to maximize their productivity",
"Agents operate as contributors who submit changes through pull requests, subject to the same review processes and branch protections as human contributors",
"Agents bypass branch protections because they are automated systems",
"Agents are restricted to read-only access and can only suggest changes through comments"
],correct:1,
explanation:"In the GitHub contributor model, AI agents are treated as contributors. They submit changes through pull requests, must respect branch protection rules, and have their work reviewed by humans (or other agents) before merging. This ensures accountability and maintains code quality guardrails."},

{id:"1-9",examId:1,domain:1,type:"mc",
question:"Why is observability important in agentic AI systems?",
options:[
"It allows the agent to run faster by caching intermediate results",
"It provides transparency into the agent's reasoning, actions, and decision points, enabling debugging, auditing, and trust-building",
"It reduces the cost of API calls by batching requests",
"It automatically fixes errors in the agent's output"
],correct:1,
explanation:"Observability gives developers and operators visibility into what the agent did, why it made certain decisions, and where things went wrong. This is critical for debugging failures, auditing agent behavior for compliance, and building trust with stakeholders who need to understand how automated decisions were made."},

{id:"1-53",examId:1,domain:1,type:"mc",
question:"What distinguishes Agent mode from Ask mode in GitHub Copilot?",
options:[
"Agent mode only works with Python files, while Ask mode works with all languages",
"Agent mode can autonomously plan multi-step tasks, invoke tools, edit files, and run terminal commands, while Ask mode is read-only and provides answers without making changes",
"Ask mode is faster because it skips the planning phase, but both can modify files",
"Agent mode requires a paid enterprise license, while Ask mode is available on all tiers"
],correct:1,
explanation:"Agent mode enables autonomous multi-step workflows: the model plans a sequence of actions, invokes tools (file edits, terminal commands, MCP tools), and iterates until the task is complete. It surfaces risky terminal commands for user approval. Ask mode is read-only — it can read code and answer questions but does not make changes. This distinction maps to the autonomy spectrum: Agent mode operates at Level 2-3, while Ask mode operates at Level 0."},

// ── Domain 2: Tool Use & Environment (16) ──
{id:"1-10",examId:1,domain:2,type:"mc",
question:"What is the Model Context Protocol (MCP)?",
options:[
"A proprietary GitHub API for managing Copilot extensions",
"An open protocol that standardizes how AI models connect to external tools and data sources",
"A database protocol for storing agent memory across sessions",
"A security protocol for encrypting agent-to-agent communication"
],correct:1,
explanation:"MCP (Model Context Protocol) is an open protocol that provides a standardized way for AI models and agents to discover and use external tools, APIs, and data sources. It defines how tools advertise their capabilities and how models invoke them."},

{id:"1-11",examId:1,domain:2,type:"mc",
question:"What is the URL for the GitHub MCP server used with GitHub Copilot?",
options:[
"https://github.com/mcp/server",
"https://api.github.com/v3/mcp",
"https://api.githubcopilot.com/mcp/",
"https://mcp.github.io/server"
],correct:2,
explanation:"The GitHub MCP server is accessed at https://api.githubcopilot.com/mcp/ and is configured as an HTTP-type (streamable HTTP) MCP server in VS Code or other compatible clients."},

{id:"1-12",examId:1,domain:2,type:"mc",
question:"In the MCP architecture, what is the difference between a local MCP server and a remote MCP server?",
options:[
"Local servers handle read operations; remote servers handle write operations",
"Local servers run as child processes on the developer's machine using stdio transport; remote servers are accessed over HTTPS",
"Local servers are faster because they skip authentication; remote servers always require OAuth",
"There is no functional difference; the terms are interchangeable"
],correct:1,
explanation:"Local MCP servers run as child processes on the same machine as the client and communicate via stdio. Remote MCP servers are hosted externally and accessed via HTTPS (streamable HTTP). The transport mechanism and hosting location are the primary differences."},

{id:"1-13",examId:1,domain:2,type:"mc",
question:"When configuring the GitHub MCP server in VS Code, which type must be specified in the settings?",
options:[
"stdio",
"websocket",
"http",
"grpc"
],correct:2,
explanation:"The GitHub MCP server uses streamable HTTP transport and must be configured with type 'http' in VS Code settings. This differs from local MCP servers that use stdio transport."},

{id:"1-14",examId:1,domain:2,type:"mc",
question:"What is the purpose of an MCP registry?",
options:[
"To store the conversation history of all agents in an organization",
"To provide a discoverable directory of MCP servers and their capabilities, allowing organizations to curate which tools are available",
"To compress MCP requests for faster transmission",
"To translate MCP requests between different programming languages"
],correct:1,
explanation:"An MCP registry serves as a curated directory of MCP servers. Organizations can use registries to manage which tools are available to agents, enabling tool discovery while maintaining governance over the tool ecosystem. The v0.1 registry spec requires HTTPS endpoints with CORS support."},

{id:"1-15",examId:1,domain:2,type:"ms",
question:"Select TWO requirements specified in the MCP registry v0.1 specification.",
options:[
"Registries must use GraphQL endpoints",
"Registry endpoints must be served over HTTPS",
"Registries must implement CORS headers for cross-origin access",
"Registries must support WebSocket connections for real-time updates"
],correct:[1,2],
explanation:"The MCP registry v0.1 spec requires HTTPS endpoints for security and CORS support for cross-origin access from web-based clients. GraphQL and WebSocket are not requirements of the registry specification."},

{id:"1-16",examId:1,domain:2,type:"mc",
question:"An organization wants to restrict GitHub Copilot to only use MCP tools from their approved internal registry. Which MCP allow list policy should they configure?",
options:[
"Allow all — permits any MCP server to be used",
"Registry only — restricts tool usage to servers listed in configured registries",
"Deny all — blocks all MCP server connections",
"Custom — allows individual per-user MCP server configurations"
],correct:1,
explanation:"The 'Registry only' policy restricts MCP tool usage to servers that are listed in configured registries. This gives organizations centralized control over which tools agents can use, enforced at the organization or enterprise level."},

{id:"1-17",examId:1,domain:2,type:"mc",
question:"At what levels can MCP allow list policies be enforced?",
options:[
"Only at the individual user level",
"Only at the repository level",
"At the organization and enterprise levels",
"At the branch level only"
],correct:2,
explanation:"MCP allow list policies are enforced at the organization and enterprise levels, providing centralized governance over which MCP tools are available across the organization. Individual users cannot override organizational policy restrictions."},

{id:"1-18",examId:1,domain:2,type:"mc",
question:"How can repository-level tool permissions scope an agent's access within a GitHub workflow?",
options:[
"By granting the agent full organization-wide access",
"By restricting the agent to specific repositories, limiting which codebases it can read from or write to",
"By automatically granting admin permissions to any repository the agent interacts with",
"Repository-level permissions have no effect on agent access"
],correct:1,
explanation:"Repository-level permissions scope an agent's access to specific repositories. This follows the principle of least privilege — an agent only gets access to the repositories it needs, preventing accidental or unauthorized changes to other codebases."},

{id:"1-19",examId:1,domain:2,type:"mc",
question:"A team uses GitHub Actions to run an AI agent that triages new issues. Which workflow trigger would be MOST appropriate?",
options:[
"on: push",
"on: schedule (cron)",
"on: issues (types: [opened])",
"on: pull_request (types: [closed])"
],correct:2,
explanation:"The issues event with the 'opened' type triggers the workflow whenever a new issue is created, which is the correct event-driven trigger for an issue triage agent. A push trigger fires on code changes, schedule runs on a timer, and pull_request closed is unrelated to issue creation."},

{id:"1-20",examId:1,domain:2,type:"mc",
question:"What is the purpose of the Copilot cloud agent firewall?",
options:[
"To block all network traffic from Copilot agent sessions",
"To restrict the network domains that a Copilot cloud agent can access during execution, limiting its external reach",
"To encrypt all data transmitted between Copilot and GitHub servers",
"To prevent users from installing unauthorized VS Code extensions"
],correct:1,
explanation:"The Copilot cloud agent firewall restricts which network domains a cloud agent can reach. This limits the blast radius of agent actions, preventing it from accessing unauthorized external services and reducing the risk of data exfiltration or unintended network interactions."},

{id:"1-21",examId:1,domain:2,type:"mc",
question:"When an MCP tool call fails during an agent's execution, what is the recommended first step?",
options:[
"Immediately retry the same call with identical parameters",
"Log the error, inspect the response details, and determine whether the failure is transient or structural before deciding on a recovery strategy",
"Terminate the agent session and alert the user",
"Ignore the failure and proceed with the next step"
],correct:1,
explanation:"The recommended approach is to log the error and analyze it before acting. Transient failures (network timeouts, rate limits) may warrant a retry with backoff, while structural failures (invalid parameters, missing permissions) require a different approach. Blind retries or ignoring failures are both anti-patterns."},

{id:"1-54",examId:1,domain:2,type:"mc",
question:"Your team wants to integrate a third-party weather API into GitHub Copilot Chat with minimal development effort. The integration only needs to fetch and display data — no custom conversation management is required. Which approach is most appropriate?",
options:[
"Build a Copilot Extension using the Agent type so you have full control over request processing",
"Build a Copilot Extension using the Skillset type, which lets you define API endpoints while the platform handles prompt crafting and function evaluation",
"Create a standalone GitHub Action that calls the weather API on a cron schedule",
"Fork the Copilot source code and add the weather API directly"
],correct:1,
explanation:"Skillset extensions are designed for lightweight integrations. You define the API endpoints and the platform handles prompt crafting, function evaluation, and routing. This minimizes development effort compared to Agent extensions, which require you to handle everything: request processing, response generation, and conversation context management. A GitHub Action wouldn't integrate with Copilot Chat, and forking Copilot is not possible."},

{id:"1-55",examId:1,domain:2,type:"mc",
question:"A developer needs full control over conversation context and wants to route Copilot Chat requests to a custom LLM hosted on their own infrastructure. Which Copilot Extension type should they build?",
options:[
"A Skillset extension, since it supports custom LLM routing",
"An Agent extension, which gives full control over request processing, response generation, and conversation context management",
"An MCP server registered in the organization's tool registry",
"A GitHub App with no Copilot integration, using webhooks instead"
],correct:1,
explanation:"Agent extensions give the developer full control: they handle the entire request lifecycle including processing incoming messages, managing conversation context, and routing to any LLM (including custom or self-hosted models). Skillset extensions delegate all of this to the Copilot platform, so they cannot route to a custom LLM. MCP servers provide tool capabilities but do not control conversation routing."},

{id:"1-56",examId:1,domain:2,type:"mc",
question:"How are Copilot Extensions invoked by end users in GitHub Copilot Chat?",
options:[
"By configuring them in a settings.json file and restarting the IDE",
"By @mentioning the extension by name in a Copilot Chat message",
"By clicking a dedicated toolbar button that each extension registers",
"By issuing a slash command prefixed with the extension's namespace"
],correct:1,
explanation:"Both Agent and Skillset Copilot Extensions are GitHub Apps that users invoke by @mentioning them in Copilot Chat. This provides a consistent, discoverable invocation pattern. Extensions do not require IDE configuration files, toolbar buttons, or slash commands — the @mention pattern works across all Copilot Chat surfaces."},

{id:"1-57",examId:1,domain:2,type:"mc",
question:"Where can a team define reusable Agent Skills that are automatically available to GitHub Copilot in their repository?",
options:[
"Only in the repository's package.json under a 'copilot-skills' key",
"In skill definition folders such as .github/skills/, .claude/skills/, or .agents/skills/ within the project, or in ~/.copilot/skills/ for personal skills",
"In a YAML file uploaded to the GitHub Marketplace",
"Agent Skills must be defined as separate npm packages published to a registry"
],correct:1,
explanation:"Agent Skills are defined as folders in well-known paths within a project (.github/skills/, .claude/skills/, .agents/skills/) or in the user's home directory (~/.copilot/skills/) for personal skills. This convention-over-configuration approach makes skills discoverable by the agent without requiring registry publication or package manager integration."},

// ── Domain 3: Memory & State (7) ──
{id:"1-22",examId:1,domain:3,type:"mc",
question:"Which of the following correctly categorizes the three types of memory in agentic AI systems?",
options:[
"Cache memory, persistent memory, and volatile memory",
"Short-term memory (current session context), long-term memory (persisted across sessions), and external memory (tools and data sources)",
"Input memory, processing memory, and output memory",
"Static memory, dynamic memory, and shared memory"
],correct:1,
explanation:"Agentic AI memory is categorized as: short-term (the current conversation/session context window), long-term (information persisted across sessions, such as files or databases), and external (tools, APIs, and data sources the agent can query). This framework helps design appropriate state management strategies."},

{id:"1-23",examId:1,domain:3,type:"mc",
question:"In a GitHub Copilot workspace, what serves as the primary mechanism for persistent agent memory?",
options:[
"The VS Code terminal history",
"The copilot-instructions.md file, which provides persistent instructions and context that the agent reads at the start of each session",
"Environment variables set in the shell",
"The agent's API token"
],correct:1,
explanation:"The copilot-instructions.md file is read by Copilot at the start of each interaction, providing persistent context and behavioral instructions. It serves as a form of long-term memory that survives across sessions, allowing teams to encode project conventions, constraints, and agent behavior guidelines."},

{id:"1-24",examId:1,domain:3,type:"mc",
question:"Why should agent memory be scoped to task-relevant information?",
options:[
"To reduce API costs by minimizing token usage",
"To prevent context pollution, which degrades the agent's reasoning quality and can cause goal drift",
"To speed up the agent's response time",
"Scoping memory has no significant impact on agent performance"
],correct:1,
explanation:"Task-relevant memory scoping prevents context pollution — the accumulation of irrelevant information that degrades the agent's ability to reason clearly about its current objective. Excess context can cause confusion, goal drift, and hallucination. While cost and speed may also benefit, the primary concern is reasoning quality."},

{id:"1-25",examId:1,domain:3,type:"mc",
question:"How can an agent resume work on a partially completed task using GitHub artifacts?",
options:[
"By reading its previous API call history from GitHub's audit log",
"By examining the state of pull requests, issues, commits, and branch history to reconstruct the task context and determine what has been completed",
"By loading a saved checkpoint file from a special .agent directory",
"By replaying its previous conversation from a stored transcript"
],correct:1,
explanation:"GitHub artifacts like pull requests, issues, and commits serve as durable state. An agent can examine a PR's description, review comments, commit history, and linked issues to reconstruct what has been done, what remains, and what feedback needs to be addressed. This makes GitHub itself a form of persistent external memory."},

{id:"1-26",examId:1,domain:3,type:"mc",
question:"What is context drift in agentic systems?",
options:[
"When the agent's model is updated to a newer version mid-session",
"When the agent's working context gradually diverges from the current state of the task, often due to stale information or accumulated irrelevant context",
"When multiple agents share a context window",
"When the agent reaches its maximum context window size"
],correct:1,
explanation:"Context drift occurs when the agent's internal representation of the task state becomes misaligned with reality. This can happen when the agent works from stale data, accumulates irrelevant context, or fails to refresh its understanding after external changes. Detection and correction of context drift is important for long-running agent tasks."},

{id:"1-27",examId:1,domain:3,type:"mc",
question:"Which memory management strategy is MOST appropriate for an agent performing a multi-hour code refactoring task?",
options:[
"Load the entire codebase into the agent's context at the start",
"Implement memory expiration, keeping only the most recently relevant files and summaries in context while archiving completed sub-tasks to durable storage",
"Disable memory management to avoid overhead",
"Reset the agent's context every 10 minutes"
],correct:1,
explanation:"For long-running tasks, memory expiration and selective loading are essential. The agent should keep its active context focused on the current sub-task, summarize and archive completed work to durable storage (like PR descriptions or commit messages), and load additional context on demand. This prevents context pollution and window exhaustion."},

{id:"1-28",examId:1,domain:3,type:"mc",
question:"A copilot-instructions.md file contains the instruction: 'Always run tests before creating a pull request.' How does this function as agent memory?",
options:[
"It serves as short-term memory that expires after each session",
"It serves as long-term persistent memory that encodes a behavioral constraint, read by the agent at the start of every interaction",
"It serves as external memory that is queried only when the agent encounters an error",
"It has no effect on agent memory; it is purely documentation"
],correct:1,
explanation:"Instructions in copilot-instructions.md function as long-term persistent memory. The file is loaded at the start of each agent session, encoding behavioral constraints and conventions that the agent must follow. This is analogous to how organizational policies persist across individual work sessions for human contributors."},

// ── Domain 4: Evaluation & Tuning (9) ──
{id:"1-29",examId:1,domain:4,type:"mc",
question:"When defining success criteria for an agent's output, what is the difference between qualitative and quantitative evaluation signals?",
options:[
"Qualitative signals are based on automated metrics; quantitative signals require human judgment",
"Quantitative signals are measurable metrics (test pass rate, code coverage); qualitative signals involve subjective assessment (code readability, solution elegance)",
"Qualitative signals apply to code; quantitative signals apply to documentation",
"There is no meaningful difference; the terms are used interchangeably"
],correct:1,
explanation:"Quantitative signals are objectively measurable: test pass rates, code coverage percentages, build times, error counts. Qualitative signals involve human judgment: is the code readable? Does the architecture make sense? Is the solution appropriate for the problem? Both types are needed for comprehensive evaluation of agent output."},

{id:"1-30",examId:1,domain:4,type:"mc",
question:"Which GitHub tool automatically scans code for security vulnerabilities and produces SARIF-formatted results?",
options:[
"Dependabot",
"GitHub Actions",
"CodeQL",
"Secret scanning"
],correct:2,
explanation:"CodeQL is GitHub's semantic code analysis engine that scans code for security vulnerabilities, bugs, and quality issues. It produces results in SARIF (Static Analysis Results Interchange Format), which can be displayed in the Security tab. Dependabot focuses on dependency vulnerabilities, while secret scanning detects exposed credentials."},

{id:"1-31",examId:1,domain:4,type:"ms",
question:"Select THREE automated scanning tools available natively in GitHub that can evaluate agent-generated code.",
options:[
"CodeQL for semantic vulnerability analysis",
"Dependabot for dependency vulnerability detection",
"Secret scanning for detecting exposed credentials and tokens",
"SonarQube for code smell detection"
],correct:[0,1,2],
explanation:"CodeQL, Dependabot, and secret scanning are all native GitHub security features. CodeQL analyzes code for vulnerabilities, Dependabot checks dependencies for known CVEs, and secret scanning detects accidentally committed credentials. SonarQube is a third-party tool, not native to GitHub."},

{id:"1-32",examId:1,domain:4,type:"mc",
question:"An agent produced a pull request that passes all automated tests but the implementation uses an inefficient algorithm. This is an example of what evaluation gap?",
options:[
"A gap between quantitative metrics and qualitative assessment — automated tests check correctness but not solution quality",
"A false positive from the testing framework",
"A context window limitation that prevented the agent from seeing better alternatives",
"A configuration error in the CI pipeline"
],correct:0,
explanation:"This illustrates the gap between quantitative metrics (tests pass = correct behavior) and qualitative assessment (algorithm efficiency, code quality). Automated tests verify correctness but often cannot evaluate whether a solution is well-designed. This is why human review remains important even when automated checks pass."},

{id:"1-33",examId:1,domain:4,type:"mc",
question:"When analyzing a failed agent task, which root cause category describes a situation where the agent used the correct tool but provided wrong parameters?",
options:[
"Reasoning error — the agent's logic for understanding the task was flawed",
"Tool misuse — the agent selected the right tool but invoked it incorrectly",
"Context issue — the agent lacked necessary information to proceed",
"Environmental failure — the external service was unavailable"
],correct:1,
explanation:"Tool misuse occurs when the agent correctly identifies which tool to use but invokes it with incorrect parameters, wrong ordering of arguments, or missing required fields. This differs from a reasoning error (wrong understanding of the task) or a context issue (missing information needed to proceed)."},

{id:"1-34",examId:1,domain:4,type:"mc",
question:"A team notices their code review agent consistently flags stylistic issues that the team considers acceptable. What is the BEST tuning approach?",
options:[
"Retrain the underlying language model on the team's codebase",
"Update the copilot-instructions.md to specify the team's style preferences and acceptable patterns",
"Disable the agent's code review capability entirely",
"Increase the agent's temperature setting to make it less opinionated"
],correct:1,
explanation:"Tuning through instruction revision is the recommended approach. By updating copilot-instructions.md with specific style preferences and acceptable patterns, the team calibrates the agent's behavior without retraining the model. This is lightweight, version-controlled, and can be refined over time based on observed results."},

{id:"1-35",examId:1,domain:4,type:"mc",
question:"What does it mean to align evaluation criteria with development intent?",
options:[
"Ensuring the test suite runs on the same operating system as the development environment",
"Ensuring that the metrics and checks used to evaluate agent output actually measure what matters for the project's goals, not just proxy metrics",
"Ensuring all developers use the same IDE",
"Ensuring the evaluation runs before the agent starts its task"
],correct:1,
explanation:"Aligning evaluation with development intent means ensuring your metrics actually measure what matters. For example, if the intent is 'reduce page load time,' measuring code coverage is a proxy metric that may not correlate with the actual goal. Evaluation criteria should directly reflect the project's objectives and priorities."},

{id:"1-36",examId:1,domain:4,type:"scenario",
scenario:"A development team deploys an agent to automatically fix Dependabot alerts. After two weeks, they notice: (1) 80% of the agent's PRs pass CI, (2) the remaining 20% fail due to breaking changes in major version updates, and (3) two PRs introduced subtle behavioral changes that weren't caught by tests.",
question:"Which combination of actions would BEST improve this agent's evaluation and tuning?",
options:[
"Increase test coverage and restrict the agent to minor/patch version updates only",
"Add a rule to copilot-instructions.md that the agent must not update major versions without human approval, and add integration tests for behavioral changes",
"Disable the agent and perform all Dependabot fixes manually",
"Increase the agent's context window to include all project documentation"
],correct:1,
explanation:"The best approach combines instruction tuning (restricting major version updates to human approval via copilot-instructions.md) with evaluation improvement (adding integration tests that catch behavioral changes). This addresses both root causes: the agent overstepping on major updates, and the test suite failing to catch subtle regressions."},

{id:"1-37",examId:1,domain:4,type:"mc",
question:"When reviewing an agent's execution trace, which information is MOST valuable for identifying why the agent produced an incorrect result?",
options:[
"The total execution time",
"The sequence of tool calls, their inputs, their outputs, and the reasoning the agent applied between steps",
"The number of tokens consumed",
"The model version and temperature settings"
],correct:1,
explanation:"The execution trace — showing which tools were called, with what inputs, what outputs were received, and how the agent reasoned between steps — provides the full causal chain that led to the result. This allows precise identification of where the agent's reasoning or actions went wrong."},

// ── Domain 5: Multi-Agent Systems (8) ──
{id:"1-38",examId:1,domain:5,type:"mc",
question:"In a multi-agent orchestration pattern, what characterizes a 'fan-out/fan-in' approach?",
options:[
"Agents are arranged in a strict hierarchy where each level reports to the level above",
"A coordinator dispatches sub-tasks to multiple agents in parallel (fan-out), then aggregates their results (fan-in)",
"Agents take turns executing one at a time in a round-robin fashion",
"All agents share a single context window and collaborate in real-time"
],correct:1,
explanation:"Fan-out/fan-in is an orchestration pattern where a coordinator agent breaks a task into independent sub-tasks, dispatches them to multiple agents for parallel execution (fan-out), and then collects and synthesizes their results into a unified output (fan-in). This pattern is efficient for tasks that can be decomposed into independent units."},

{id:"1-39",examId:1,domain:5,type:"mc",
question:"Which orchestration pattern would be MOST appropriate for a workflow where an agent writes code, then a different agent reviews it, then a third agent writes tests?",
options:[
"Parallel orchestration",
"Fan-out/fan-in orchestration",
"Sequential orchestration",
"Hierarchical orchestration"
],correct:2,
explanation:"Sequential orchestration is appropriate when each step depends on the output of the previous step. The reviewer needs the code to review, and the test writer needs both the code and the review feedback. Each agent's output feeds into the next agent's input in a defined order."},

{id:"1-40",examId:1,domain:5,type:"mc",
question:"What is agent isolation in a multi-agent system?",
options:[
"Running each agent on a separate physical server",
"Ensuring each agent has its own scoped context, permissions, and resources, preventing unintended interference between agents",
"Preventing agents from accessing the internet",
"Running agents at different times of day to avoid resource contention"
],correct:1,
explanation:"Agent isolation means each agent operates with its own scoped context, permissions, and resource boundaries. This prevents one agent from accidentally modifying another agent's state, accessing unauthorized resources, or creating unintended side effects. It is a key principle for reliable multi-agent systems."},

{id:"1-41",examId:1,domain:5,type:"ms",
question:"Select TWO types of conflicts that can occur in multi-agent systems.",
options:[
"Merge conflicts when multiple agents modify the same files concurrently",
"License conflicts when agents use different open-source libraries",
"Duplicated effort when multiple agents unknowingly work on the same sub-task",
"Time zone conflicts when agents are deployed in different regions"
],correct:[0,2],
explanation:"Merge conflicts occur when multiple agents edit the same files and their changes are incompatible. Duplicated effort happens when coordination is insufficient and multiple agents perform the same work independently. Both waste resources and can create inconsistencies. License and time zone conflicts are not specific multi-agent coordination concerns."},

{id:"1-42",examId:1,domain:5,type:"mc",
question:"Why is observability especially important in multi-agent systems compared to single-agent systems?",
options:[
"Multi-agent systems use more API tokens",
"With multiple agents acting concurrently, tracing the causal chain of decisions and actions across agents is necessary to diagnose failures, attribute responsibility, and detect emergent behaviors",
"Multi-agent systems always run faster",
"Observability is equally important regardless of the number of agents"
],correct:1,
explanation:"In multi-agent systems, failures can cascade across agents, and the root cause may be in a different agent than the one that produced the visible error. Observability across all agents allows operators to trace the full causal chain, understand inter-agent interactions, and detect emergent behaviors that no single agent's logs would reveal."},

{id:"1-43",examId:1,domain:5,type:"mc",
question:"When a multi-agent workflow fails partway through, what is the MOST robust recovery strategy?",
options:[
"Restart the entire workflow from the beginning",
"Implement rollback capabilities for completed steps and human-in-the-loop escalation for ambiguous failure states",
"Ignore the failure and continue with the remaining steps",
"Delete all artifacts produced by the failed workflow"
],correct:1,
explanation:"Robust recovery combines rollback (undoing completed steps that depend on the failed step) with human escalation for ambiguous cases. Restarting everything is wasteful, ignoring failures creates inconsistent state, and deleting all artifacts loses completed work. Targeted rollback with human judgment for edge cases is the recommended pattern."},

{id:"1-44",examId:1,domain:5,type:"mc",
question:"What does agent lifecycle management encompass?",
options:[
"Only the initial deployment of agents",
"The full process of adding, configuring, updating, monitoring, and retiring agents within a system",
"Only monitoring agent performance metrics",
"Only removing agents that are no longer needed"
],correct:1,
explanation:"Agent lifecycle management covers the complete span: adding new agents to a system, configuring their roles and permissions, updating their behavior as requirements evolve, monitoring their ongoing performance, and retiring agents when they are no longer needed — including preserving audit trails from retired agents."},

{id:"1-45",examId:1,domain:5,type:"mc",
question:"A team has a multi-agent system where Agent A generates code and Agent B reviews it. Agent B consistently flags false positives. What is the MOST effective improvement?",
options:[
"Remove Agent B and rely on human review only",
"Tune Agent B's instructions to include examples of acceptable patterns, and add a feedback loop where Agent A's successful PRs calibrate Agent B's thresholds",
"Give Agent B access to Agent A's internal reasoning to reduce misunderstandings",
"Merge Agent A and Agent B into a single agent that writes and reviews its own code"
],correct:1,
explanation:"Tuning Agent B's instructions with specific examples addresses the false positives directly. Adding a feedback loop where successful outcomes calibrate future behavior creates continuous improvement. Merging agents removes the benefit of independent review, and sharing internal reasoning creates tight coupling between agents."},

// ── Domain 6: Guardrails & Safety (7) ──
{id:"1-46",examId:1,domain:6,type:"mc",
question:"Which risk classification category describes the danger of an agent accidentally exposing API keys in a public repository?",
options:[
"Operational risk",
"Security risk",
"Compliance risk",
"Reputational risk"
],correct:1,
explanation:"Exposing API keys is a security risk — it creates a vulnerability that could be exploited by unauthorized parties. While it may also have operational and compliance implications, the primary classification is security because the direct danger is unauthorized access to protected resources."},

{id:"1-47",examId:1,domain:6,type:"ordering",
question:"Arrange the following autonomy levels from LEAST to MOST autonomous.",
options:[
"Agent executes all actions independently with no human oversight",
"Agent suggests actions but human must approve each one",
"Human performs all actions; no agent involvement",
"Agent executes routine actions autonomously, escalates significant decisions to humans",
"Agent operates autonomously with post-hoc review on a regular cadence"
],correct:[2,1,3,4,0],
explanation:"The autonomy spectrum runs from Level 0 (fully manual) through Level 1 (agent suggests, human acts), Level 2 (agent acts on routine tasks, human decides on significant ones), Level 3 (autonomous with periodic review), to Level 4 (fully autonomous). Each level trades more human control for greater agent speed."},

{id:"1-48",examId:1,domain:6,type:"mc",
question:"Which GitHub feature acts as a guardrail by requiring specific reviewers to approve changes to designated files or directories?",
options:[
"Branch protection rules",
"GitHub Actions",
"CODEOWNERS file",
"Repository topics"
],correct:2,
explanation:"The CODEOWNERS file designates specific individuals or teams as required reviewers for changes to matching file paths. When an agent (or human) creates a PR that modifies these files, the designated owners are automatically added as required reviewers, creating a guardrail that ensures expert oversight."},

{id:"1-49",examId:1,domain:6,type:"mc",
question:"How does the principle of least privilege apply to AI agents in GitHub?",
options:[
"Agents should be given the minimum permissions necessary to complete their assigned tasks, nothing more",
"Agents should have broad permissions to be maximally effective",
"Least privilege only applies to human users, not automated agents",
"Agents should have read-only access to all repositories by default"
],correct:0,
explanation:"Least privilege means granting only the permissions required for the specific task. An agent that only needs to read code and create PRs should not have admin access. This limits the blast radius if the agent malfunctions or is compromised, reducing security, operational, and compliance risks."},

{id:"1-50",examId:1,domain:6,type:"mc",
question:"A team configures a branch protection rule requiring at least 2 approving reviews before merging to main. How does this serve as an agent guardrail?",
options:[
"It prevents the agent from pushing code to any branch",
"It ensures that even if an agent creates a PR, at least two humans (or authorized reviewers) must approve the changes before they reach the production branch",
"It automatically reverts any agent-generated code",
"It restricts agents to read-only access"
],correct:1,
explanation:"Branch protection rules requiring multiple reviews create a human-in-the-loop guardrail. The agent can still create PRs and contribute code, but the changes cannot reach the protected branch without the required approvals. This balances agent productivity with human oversight on critical code paths."},

{id:"1-51",examId:1,domain:6,type:"mc",
question:"When should a human-in-the-loop checkpoint be triggered in an agentic workflow?",
options:[
"Only when the agent encounters a runtime error",
"When the agent is about to perform a high-risk action, when it encounters ambiguity it cannot resolve, or when it reaches a predefined decision boundary",
"At every single step to ensure maximum safety",
"Only at the end of the workflow before final delivery"
],correct:1,
explanation:"Human-in-the-loop triggers should be placed at risk-appropriate points: before high-impact actions (deploying to production, deleting resources), when the agent faces unresolvable ambiguity, or at predefined boundaries (cost thresholds, scope limits). Triggering at every step destroys productivity; triggering only at the end provides no protection during execution."},

{id:"1-52",examId:1,domain:6,type:"scenario",
scenario:"A fintech company wants to deploy an AI agent that automatically fixes security vulnerabilities detected by Dependabot in their payment processing service. The service handles PCI-DSS regulated credit card data. The team wants the agent to work quickly to minimize exposure windows.",
question:"Which guardrail configuration BEST balances velocity with compliance requirements?",
options:[
"Give the agent full autonomy (Level 4) to fix and merge patches immediately, since speed is the priority",
"Configure the agent at Level 2: it can create PRs with fixes automatically, but require CODEOWNERS approval from the security team plus passing CodeQL and integration tests before merge",
"Restrict the agent to Level 0 and have humans fix all vulnerabilities manually",
"Allow the agent to merge directly to main but require a post-deployment audit review within 48 hours"
],correct:1,
explanation:"For PCI-DSS regulated services, Level 2 autonomy balances speed with compliance. The agent acts quickly to create fix PRs (reducing exposure window), but CODEOWNERS review from the security team and automated checks (CodeQL, integration tests) ensure compliance requirements are met before changes reach production. Full autonomy violates PCI-DSS change management requirements, while Level 0 is unnecessarily slow."},
