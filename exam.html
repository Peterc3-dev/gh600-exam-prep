// ── Domain 1: Architecture & SDLC (10) ──
{id:"2-1",examId:2,domain:1,type:"scenario",
scenario:"Your team is building an agent to automate the triage of incoming GitHub issues for a large open-source project. The agent should read the issue title and body, apply appropriate labels, assign it to the correct team, and add a comment acknowledging receipt. The project receives 50-100 new issues daily.",
question:"Which architectural approach is MOST appropriate for this agent?",
options:[
"A fully autonomous agent that triages and closes issues without any human review",
"An event-driven agent triggered by the 'issues opened' event that applies labels and assignments, with a human review queue for ambiguous issues",
"A scheduled agent that runs once daily to batch-process all new issues",
"A purely reactive assistant that waits for a maintainer to ask it about each issue individually"
],correct:1,
explanation:"An event-driven agent with human escalation for ambiguous cases is the best fit. It processes issues as they arrive (reducing response time), handles clear-cut cases autonomously (labels, assignments), and escalates ambiguous issues to humans. A daily batch creates delays, full autonomy risks misclassification, and a reactive assistant doesn't scale to 50-100 issues/day."},

{id:"2-2",examId:2,domain:1,type:"mc",
question:"A team is designing an agent that generates migration scripts for database schema changes. Which anti-pattern is MOST dangerous to allow in this context?",
options:[
"Scope creep — the agent expanding beyond schema migration to also modify application code",
"Missing traceability — the agent producing migration scripts without logging which changes were made and why",
"Both scope creep and missing traceability are equally dangerous in this context",
"Neither is a significant concern for database migrations"
],correct:2,
explanation:"Both anti-patterns are critically dangerous for database migrations. Scope creep could lead the agent to make unintended application changes. Missing traceability makes it impossible to audit what schema changes were applied and why, which is essential for rollback capability and compliance. In database migrations, both anti-patterns create serious operational and compliance risks."},

{id:"2-3",examId:2,domain:1,type:"mc",
question:"Which of the following is a well-defined planning artifact for an agentic workflow?",
options:[
"A vague instruction like 'fix all the bugs'",
"A structured task breakdown specifying: the goal, ordered sub-tasks, expected outputs for each sub-task, success criteria, and escalation triggers",
"A simple one-line description of the desired end state",
"A list of all available tools the agent could potentially use"
],correct:1,
explanation:"A well-defined planning artifact provides the agent with clear structure: a specific goal, ordered sub-tasks with expected outputs, measurable success criteria, and defined escalation triggers. This gives the agent a roadmap and enables evaluation of its progress. Vague instructions lead to goal drift and ambiguous execution."},

{id:"2-4",examId:2,domain:1,type:"mc",
question:"When should an agent's autonomy level be REDUCED from its default setting?",
options:[
"When the agent has been performing well for an extended period",
"When the agent is operating on unfamiliar codebases, performing irreversible actions, or working in regulated environments",
"When the development team is understaffed and needs the agent to take on more responsibility",
"When the agent's response time needs to be faster"
],correct:1,
explanation:"Autonomy should be reduced when risk increases: unfamiliar codebases increase the chance of incorrect assumptions, irreversible actions raise the cost of mistakes, and regulated environments demand documented human oversight. Good past performance on familiar tasks doesn't guarantee safety in new contexts."},

{id:"2-5",examId:2,domain:1,type:"ms",
question:"Select TWO characteristics that distinguish a plan-and-execute workflow from a purely reactive workflow.",
options:[
"The agent creates an explicit plan before taking any actions",
"The agent can only respond to direct user prompts",
"The agent evaluates intermediate results against the plan and adjusts its approach",
"The agent completes its task in a single API call"
],correct:[0,2],
explanation:"Plan-and-execute workflows are characterized by upfront planning (creating an explicit plan before acting) and iterative evaluation (checking intermediate results against the plan and adjusting). Reactive workflows respond to prompts without planning, and neither workflow type is limited to a single API call."},

{id:"2-6",examId:2,domain:1,type:"mc",
question:"An agent is configured to automatically refactor functions that exceed 50 lines. During execution, it also starts renaming variables throughout the codebase to match a style guide. This is an example of which anti-pattern?",
options:[
"Context pollution",
"Goal drift",
"Scope creep",
"Over-autonomy"
],correct:2,
explanation:"Scope creep occurs when an agent expands its actions beyond its defined task. The agent was assigned to refactor long functions but expanded into variable renaming, which was not part of its mandate. This is distinct from goal drift (shifting objectives) because the original goal hasn't changed — the agent is simply doing more than it should."},

{id:"2-7",examId:2,domain:1,type:"mc",
question:"What role do observability requirements play in the SDLC for agentic systems?",
options:[
"They are optional nice-to-haves that can be added after deployment",
"They should be defined during the design phase and built into the agent's architecture from the start, not bolted on afterward",
"They only matter for multi-agent systems, not single agents",
"They are automatically handled by the language model and require no additional implementation"
],correct:1,
explanation:"Observability requirements should be first-class design considerations, not afterthoughts. Logging, tracing, and monitoring must be architected into the agent from the start to ensure that execution traces, tool call records, and decision rationale are captured. Adding observability after deployment is significantly more difficult and may miss critical events."},

{id:"2-8",examId:2,domain:1,type:"mc",
question:"A startup wants their agent to handle everything from writing code to deploying to production to responding to customer support tickets. What is the PRIMARY risk of this approach?",
options:[
"The agent will be too slow",
"Over-autonomy combined with scope creep — the agent has too much authority across too many domains, making failures harder to diagnose and contain",
"The agent will use too many API tokens",
"There is no significant risk; modern LLMs can handle diverse tasks effectively"
],correct:1,
explanation:"Giving a single agent authority over code, deployment, and customer support combines over-autonomy (too much decision-making power) with scope creep (too broad a mandate). Failures become harder to diagnose because the blast radius spans multiple domains. Best practice is to scope agents to specific domains with appropriate autonomy levels for each."},

{id:"2-9",examId:2,domain:1,type:"mc",
question:"How should inputs and outputs be defined for an agent that automates release note generation?",
options:[
"Inputs: everything in the repository. Outputs: whatever the agent thinks is relevant.",
"Inputs: commit messages, PR descriptions, and linked issues since the last release tag. Outputs: a structured release note document with categorized changes (features, fixes, breaking changes) and contributor attributions.",
"Inputs: the repository README. Outputs: a summary of the README.",
"Inputs: the agent's previous outputs. Outputs: an improved version of its previous output."
],correct:1,
explanation:"Well-defined inputs and outputs are essential for reliable agent behavior. Specific inputs (commits, PRs, issues since last tag) bound the agent's data scope. Structured outputs (categorized changes, attributions) provide clear success criteria. Vague inputs/outputs lead to inconsistent results and make evaluation impossible."},

{id:"2-53",examId:2,domain:1,type:"scenario",
scenario:"A team is evaluating GitHub Copilot's different interaction modes for a complex codebase migration. The migration involves updating hundreds of files to use a new API. Junior developers need guidance on the new patterns, while senior developers want to automate the repetitive refactoring steps.",
question:"Which combination of Copilot modes best serves both groups?",
options:[
"Use Agent mode for everyone — it handles all scenarios",
"Junior developers use Ask mode to learn the new API patterns and get explanations without risk of unintended changes; senior developers use Agent mode to autonomously plan and execute multi-file refactoring with tool use and terminal commands",
"Use Edit mode exclusively since it provides surgical inline changes",
"Have junior developers avoid Copilot entirely and only let seniors use Ask mode"
],correct:1,
explanation:"Ask mode is read-only and safe for learning — junior developers can explore the codebase, ask about patterns, and get explanations without any risk of unintended modifications. Agent mode gives senior developers autonomous multi-step execution: it plans the refactoring, edits files, runs tests, and iterates — ideal for repetitive large-scale changes. Matching the mode to the user's experience level and intent provides both safety and productivity."},

// ── Domain 2: Tool Use & Environment (15) ──
{id:"2-10",examId:2,domain:2,type:"ordering",
question:"Place the following steps in the correct order for configuring the GitHub MCP server in VS Code.",
options:[
"Use the MCP tools in Copilot chat by referencing available GitHub tools",
"Open VS Code settings and navigate to the MCP server configuration",
"Authenticate with your GitHub account when prompted",
"Add a new MCP server entry with URL https://api.githubcopilot.com/mcp/ and type http"
],correct:[1,3,2,0],
explanation:"The correct setup flow is: (1) Open VS Code settings and find the MCP configuration, (2) Add the GitHub MCP server entry with the correct URL and type, (3) Authenticate with GitHub when the server first connects, (4) Begin using the tools in Copilot chat. Authentication must happen after the server is configured but before tools are usable."},

{id:"2-11",examId:2,domain:2,type:"scenario",
scenario:"You are a DevOps engineer at a company with 200 developers. The security team has approved a set of 15 MCP tools for use, hosted across 3 internal MCP servers. They want to ensure no developer can add unapproved MCP servers to their Copilot configuration.",
question:"Which configuration approach enforces this requirement?",
options:[
"Send an email asking developers to only use approved servers",
"Configure an MCP allow list at the organization level set to 'Registry only,' with only the 3 approved servers in the registry",
"Set each developer's VS Code settings to read-only",
"Disable Copilot for all users and only enable it for the security team"
],correct:1,
explanation:"An organization-level MCP allow list set to 'Registry only' ensures that Copilot can only connect to MCP servers listed in the approved registry. Individual developers cannot add unapproved servers because the policy is enforced at the organization level, not at the individual VS Code configuration level."},

{id:"2-12",examId:2,domain:2,type:"scenario",
scenario:"You are writing a copilot-instructions.md file for a Python web application repository. The team uses pytest for testing, follows PEP 8 style guidelines, uses type hints on all public functions, and requires docstrings in Google style format.",
question:"Which copilot-instructions.md content BEST captures these requirements?",
options:[
"Please write good Python code.",
"Use pytest. Follow PEP 8. Add type hints. Write docstrings.",
"When generating or modifying Python code: run tests with pytest before submitting PRs; follow PEP 8 style conventions; add type hints to all public function signatures; write docstrings in Google style format for all public modules, classes, and functions.",
"This is a Python project. The agent should know what to do."
],correct:2,
explanation:"The third option provides clear, specific, actionable instructions that cover all four requirements with enough detail for the agent to follow them consistently. It specifies when to apply each rule and the scope of each requirement. Vague instructions lead to inconsistent agent behavior."},

{id:"2-13",examId:2,domain:2,type:"mc",
question:"Which GitHub Actions workflow trigger is appropriate for an agent that should run when a pull request is opened or updated?",
options:[
"on: push",
"on: pull_request: types: [opened, synchronize]",
"on: issues: types: [opened]",
"on: schedule: cron: '0 * * * *'"
],correct:1,
explanation:"The pull_request event with types [opened, synchronize] triggers when a PR is first created and when new commits are pushed to the PR branch. This ensures the agent runs on initial submission and on updates. The 'push' event fires on all pushes regardless of PR context, and the others are unrelated to PR activity."},

{id:"2-14",examId:2,domain:2,type:"scenario",
scenario:"An agent running in a GitHub Actions workflow fails with the error: 'MCP tool call to github/create_pull_request failed: 403 Forbidden — Resource not accessible by integration.' The workflow uses the default GITHUB_TOKEN.",
question:"What is the MOST likely cause and fix?",
options:[
"The repository doesn't exist. Create the repository first.",
"The GITHUB_TOKEN lacks the required permissions. Add 'permissions: pull-requests: write' to the workflow YAML.",
"The MCP server is down. Wait and retry later.",
"The agent exceeded its rate limit. Add a sleep delay between API calls."
],correct:1,
explanation:"A 403 'Resource not accessible by integration' error typically means the GITHUB_TOKEN doesn't have the required permissions for the action. GitHub Actions workflows need explicit permission grants. Adding 'permissions: pull-requests: write' to the workflow YAML grants the token the ability to create pull requests."},

{id:"2-15",examId:2,domain:2,type:"mc",
question:"How does branch-based scoping work for agent permissions?",
options:[
"Agents can only access branches that start with 'agent/'",
"Agent permissions can be configured to only allow operations on specific branches, such as restricting an agent to only create branches with a defined prefix",
"Branch-based scoping automatically blocks all agents from the main branch",
"Branch-based scoping is not a supported feature"
],correct:1,
explanation:"Branch-based scoping restricts which branches an agent can interact with. For example, an agent might be limited to creating branches with a prefix like 'agent/' or 'copilot/', preventing it from pushing directly to main or other protected branches. This adds a layer of isolation to agent operations."},

{id:"2-16",examId:2,domain:2,type:"mc",
question:"An agent needs to read files from a private repository to generate documentation. Which permission configuration follows least privilege?",
options:[
"Grant admin access to the repository",
"Grant read-only access (contents: read) scoped to only that specific repository",
"Grant write access to all repositories in the organization",
"Grant read access to all repositories in the organization"
],correct:1,
explanation:"Least privilege means granting the minimum required access: read-only content access to the specific repository needed. Admin access is excessive, write access is unnecessary for reading files, and organization-wide access violates repository-level scoping principles."},

{id:"2-17",examId:2,domain:2,type:"mc",
question:"When should an agent escalate to a human rather than attempting to resolve an issue on its own?",
options:[
"Only when the agent encounters a fatal runtime error",
"When the agent encounters ambiguity it cannot resolve, when the action exceeds its authorized scope, or when confidence in its solution falls below a defined threshold",
"Agents should never escalate; they should always complete the task independently",
"Only when explicitly asked by the user"
],correct:1,
explanation:"Escalation should be triggered by multiple conditions: unresolvable ambiguity (the agent doesn't have enough information to make a sound decision), scope boundary violations (the action is outside the agent's authorized permissions), and low confidence (the agent isn't sure its approach is correct). These conditions should be defined in the agent's configuration."},

{id:"2-18",examId:2,domain:2,type:"mc",
question:"What is the purpose of configuring an MCP server with Azure API Center as a registry backend?",
options:[
"To host the MCP server on Azure infrastructure",
"To leverage Azure API Center as a curated registry for discovering and managing MCP servers, integrating with organizational API governance",
"To encrypt MCP tool calls using Azure Key Vault",
"To automatically scale MCP servers based on demand"
],correct:1,
explanation:"Azure API Center can serve as an MCP registry backend, providing organizations with a governed, curated directory of available MCP servers. This integrates MCP tool management with existing API governance infrastructure, allowing centralized control over which tools are available to agents."},

{id:"2-19",examId:2,domain:2,type:"mc",
question:"In a CI/CD pipeline, how should an agent's GitHub Actions workflow handle secrets needed for MCP tool calls?",
options:[
"Hard-code the secrets directly in the workflow YAML file",
"Store secrets in GitHub repository or environment secrets and reference them using the ${{ secrets.SECRET_NAME }} syntax",
"Pass secrets as command-line arguments to the workflow",
"Store secrets in a .env file committed to the repository"
],correct:1,
explanation:"GitHub Actions secrets should be stored in the repository or environment secrets settings and referenced using the ${{ secrets.SECRET_NAME }} expression. Secrets are masked in logs and never exposed in the workflow file. Hard-coding secrets, committing .env files, or passing them as arguments all risk exposing credentials."},

{id:"2-20",examId:2,domain:2,type:"ms",
question:"Select TWO valid approaches for handling tool errors in an agentic workflow.",
options:[
"Implement exponential backoff with retry for transient failures like rate limits or timeouts",
"Catch all errors silently and continue execution without logging",
"Fall back to an alternative tool or approach when the primary tool is unavailable",
"Increase the agent's timeout to infinity so no timeouts occur"
],correct:[0,2],
explanation:"Exponential backoff handles transient failures gracefully without overwhelming the service. Falling back to alternative tools provides resilience when primary tools are unavailable. Silent error swallowing hides problems, and infinite timeouts waste resources and can cause workflows to hang indefinitely."},

{id:"2-54",examId:2,domain:2,type:"scenario",
scenario:"Your organization has an internal knowledge base with a REST API. The team wants Copilot Chat users to be able to query this knowledge base by typing '@kb-search what is our deployment process?' in chat. The knowledge base API is stable and well-documented, and no custom conversation logic is needed.",
question:"Which implementation approach should the team use?",
options:[
"Build a Copilot Agent extension that manages its own conversation context and calls the knowledge base API",
"Build a Copilot Skillset extension that defines the knowledge base API endpoints, letting the Copilot platform handle prompt crafting and function evaluation",
"Deploy an MCP server that wraps the knowledge base API and configure it in each developer's IDE settings",
"Create a GitHub Action triggered by issue comments that queries the knowledge base"
],correct:1,
explanation:"A Skillset extension is the right choice for a stable, well-documented API that needs no custom conversation management. You define the API endpoints and the platform handles everything else: crafting prompts, evaluating function calls, and routing responses. An Agent extension would work but adds unnecessary complexity. An MCP server requires per-developer configuration rather than being available to all Copilot Chat users via @mention."},

{id:"2-55",examId:2,domain:2,type:"scenario",
scenario:"A platform team is building a Copilot Extension that needs to: (1) maintain a multi-turn conversation about infrastructure provisioning, (2) call their custom Terraform planning engine, and (3) present results using their own formatting and safety checks before showing users the output.",
question:"Which extension type is required?",
options:[
"A Skillset extension, because it handles multi-turn conversations automatically",
"An Agent extension, because the team needs to manage conversation context, process requests through their custom engine, and control response formatting",
"Either type would work — Agent and Skillset extensions have the same capabilities",
"A standard GitHub App webhook with no Copilot integration"
],correct:1,
explanation:"The requirements demand an Agent extension: managing multi-turn conversation context, routing requests to a custom backend (Terraform engine), and controlling response formatting are all responsibilities the developer must handle. Skillset extensions delegate prompt crafting and function evaluation to the platform, which means you cannot intercept responses for custom formatting or maintain complex conversation state. The trade-off is more development effort for full control."},

{id:"2-56",examId:2,domain:2,type:"mc",
question:"A developer wants to add a new capability to Copilot that lets it query a Jira instance. They are comparing three approaches: an MCP server, a Copilot Skillset extension, and a Copilot Agent extension. Which statement correctly describes a key difference?",
options:[
"MCP servers and Copilot Extensions are identical — the terms are interchangeable",
"An MCP server provides tool capabilities to the local IDE agent, while a Copilot Extension (Agent or Skillset) is a GitHub App invoked via @mention in Copilot Chat that can serve all users in an organization without per-developer IDE configuration",
"Copilot Extensions can only be used in VS Code, while MCP servers work everywhere",
"MCP servers require GitHub Enterprise, while Copilot Extensions work on all plans"
],correct:1,
explanation:"MCP servers are configured per-developer in the IDE (e.g., VS Code settings or .vscode/mcp.json) and provide tool capabilities to the local agent session. Copilot Extensions are GitHub Apps that any Copilot Chat user can invoke via @mention — they are centrally deployed and do not require individual IDE configuration. Both can query external APIs like Jira, but they differ in deployment model, discoverability, and configuration scope."},

{id:"2-57",examId:2,domain:2,type:"mc",
question:"The Copilot agent SDK allows developers to embed agentic capabilities into any application. Which capability does the SDK provide?",
options:[
"It only provides code completion suggestions, similar to Copilot's inline completions",
"It embeds an agentic core that can plan multi-step tasks, invoke tools, edit files, and run commands within the host application",
"It provides a REST API for managing GitHub repositories but has no agent functionality",
"It generates static documentation from source code"
],correct:1,
explanation:"The Copilot agent SDK embeds the agentic core into any application. This includes the ability to plan and execute multi-step tasks, invoke registered tools, edit files, and run terminal commands — the same capabilities available in Agent mode within the IDE, but now available to custom applications. This enables building custom agentic workflows outside of the standard Copilot Chat interface."},

// ── Domain 3: Memory & State (7) ──
{id:"2-21",examId:2,domain:3,type:"scenario",
scenario:"You are building a copilot-instructions.md file for a microservices project with 12 services. Each service has its own conventions. The monorepo has service-specific directories under /services/.",
question:"How should you structure memory instructions for this agent?",
options:[
"Put all conventions for all 12 services in a single copilot-instructions.md at the repo root",
"Place a copilot-instructions.md at the repo root with shared conventions, and service-specific copilot-instructions.md files in each /services/<name>/ directory with local overrides",
"Don't use copilot-instructions.md; rely on the agent learning conventions from code context",
"Create a single massive instruction file and duplicate it in every service directory"
],correct:1,
explanation:"Hierarchical instruction files follow the principle of memory scoping. The root file provides shared conventions (language, testing framework, PR process), while service-specific files add local context (service-specific API patterns, database conventions). This prevents context pollution — the agent loads only the relevant instructions for the service it's currently working on."},

{id:"2-22",examId:2,domain:3,type:"mc",
question:"An agent working on a long-running task has been active for 3 hours. The original issue description said 'implement search functionality,' but the codebase has changed significantly since the issue was filed. The agent is still working from the original issue text. What problem does this illustrate?",
options:[
"Token limit exhaustion",
"Context drift — the agent's understanding is based on stale information that no longer reflects the current codebase state",
"Goal drift — the agent has changed its objective",
"Memory leak — the agent is consuming too much system memory"
],correct:1,
explanation:"This is context drift: the agent's working context (the original issue description) no longer matches the current reality (the codebase has changed). The agent needs to refresh its understanding by re-reading the current state of the codebase rather than relying on the stale issue text."},

{id:"2-23",examId:2,domain:3,type:"mc",
question:"Which GitHub artifact provides the RICHEST context for an agent resuming work on an incomplete feature?",
options:[
"The branch name",
"The pull request, which contains the description, commit history, review comments, CI results, and linked issues",
"The most recent commit message",
"The repository's README file"
],correct:1,
explanation:"A pull request is the richest contextual artifact because it aggregates multiple information sources: the PR description (intent), commit history (what was done), review comments (feedback), CI results (quality signals), and linked issues (requirements). An agent can reconstruct extensive task context from a well-maintained PR."},

{id:"2-24",examId:2,domain:3,type:"mc",
question:"What is the risk of storing all intermediate agent state in the agent's context window rather than in external durable storage?",
options:[
"There is no risk; the context window is the most reliable storage",
"The context window has finite capacity, and accumulating state can cause the agent to lose important earlier context, degrade reasoning quality, or exceed token limits",
"External storage is always slower than context window storage",
"Context window state is automatically backed up by the language model provider"
],correct:1,
explanation:"Context windows have finite capacity. Storing all intermediate state there risks: pushing out important earlier context (earlier information is lost as the window fills), degrading reasoning quality (too much information overwhelms the model), and exceeding token limits (which truncates or fails). Critical state should be persisted to durable external storage."},

{id:"2-25",examId:2,domain:3,type:"mc",
question:"How should an agent handle memory pruning for a task that involves modifying 50 files?",
options:[
"Load all 50 files into context simultaneously",
"Process files in batches, keeping only the current batch and a summary of completed batches in context, writing results to durable storage as each batch completes",
"Process one file at a time with no memory of previous files",
"Stop after 10 files and ask the user to manually complete the rest"
],correct:1,
explanation:"Batch processing with summarization is the optimal memory strategy for large-scale tasks. Keeping only the current batch in context prevents window exhaustion, summaries of completed work maintain coherence across batches, and durable storage (commits, PRs) ensures no work is lost if the agent fails mid-task."},

{id:"2-26",examId:2,domain:3,type:"mc",
question:"A copilot-instructions.md includes the instruction: 'When modifying database schema files in /db/migrations/, always check the most recent 5 migration files for naming convention and sequence numbering.' What type of memory strategy does this represent?",
options:[
"Short-term memory — it only applies to the current session",
"External memory retrieval — the instruction directs the agent to query specific external data sources before acting",
"Static memory — the instruction never changes",
"Cached memory — the instruction pre-loads migration data"
],correct:1,
explanation:"This instruction directs the agent to retrieve specific external information (recent migration files) before acting. It's a form of external memory retrieval — the copilot-instructions.md serves as persistent memory that encodes a retrieval behavior, ensuring the agent always has up-to-date context from the filesystem before creating new migrations."},

{id:"2-27",examId:2,domain:3,type:"mc",
question:"Which approach BEST prevents context pollution when an agent handles multiple unrelated sub-tasks?",
options:[
"Complete all sub-tasks simultaneously with shared context",
"Isolate each sub-task with its own scoped context, carrying forward only relevant summaries between tasks",
"Use a single global context for all tasks to maximize information sharing",
"Randomly select which context to retain after each sub-task"
],correct:1,
explanation:"Context isolation between unrelated sub-tasks prevents cross-contamination. Each sub-task gets its own clean context with only relevant information. When moving to the next sub-task, only pertinent summaries carry forward, not the full detailed context. This keeps each sub-task's reasoning focused and prevents irrelevant information from degrading performance."},

// ── Domain 4: Evaluation & Tuning (8) ──
{id:"2-28",examId:2,domain:4,type:"scenario",
scenario:"Your team deploys an agent that generates unit tests for new Python functions. After one month, you collect the following data: 90% of generated tests pass, 70% achieve adequate code coverage, but developers report that 40% of the tests are 'trivial' — they test obvious cases and miss edge cases.",
question:"What evaluation signals indicate the agent needs tuning, and what tuning approach would you take?",
options:[
"The 90% pass rate is good enough; no tuning needed",
"The 40% trivial test rate is a qualitative signal. Tune by updating copilot-instructions.md with specific edge case categories and examples of non-trivial tests, then re-evaluate the trivial rate",
"Increase the model temperature to generate more creative tests",
"Replace the agent with a rule-based test generator"
],correct:1,
explanation:"The 40% trivial rate is a qualitative evaluation signal that automated metrics (pass rate, coverage) miss. The tuning approach is to revise the agent's instructions with specific guidance on what constitutes a valuable test, including examples of edge case categories (boundary values, error conditions, null inputs). Then re-evaluate the trivial rate to measure improvement."},

{id:"2-29",examId:2,domain:4,type:"mc",
question:"What is the relationship between SARIF and CodeQL in the GitHub ecosystem?",
options:[
"SARIF is a competitor to CodeQL",
"SARIF (Static Analysis Results Interchange Format) is the output format used by CodeQL to report security analysis findings in a standardized, machine-readable way",
"SARIF is a configuration format for CodeQL queries",
"CodeQL converts SARIF files into human-readable reports"
],correct:1,
explanation:"SARIF is a standardized JSON format for representing static analysis results. CodeQL produces SARIF output, which GitHub's Security tab can parse and display. This standardization means other static analysis tools can also produce SARIF, and GitHub can uniformly display results from multiple scanners."},

{id:"2-30",examId:2,domain:4,type:"mc",
question:"An agent's execution log shows: Step 1: Read file A. Step 2: Identified function to modify. Step 3: Called edit tool with line range 45-52. Step 4: Edit tool returned error 'line range out of bounds.' Step 5: Agent retried with line range 45-52. Step 6: Same error. What root cause category does this indicate?",
options:[
"Context issue — the agent may be working with stale file information where line numbers have shifted",
"Environmental failure — the edit tool is broken",
"Reasoning error — the agent fundamentally misunderstood the task",
"The agent correctly identified the issue and is awaiting human assistance"
],correct:0,
explanation:"The agent identified the correct function and line range, but the actual file has changed since it was read (or the agent's line count was wrong). This is a context issue — the agent's internal representation of the file doesn't match reality. The fix is for the agent to re-read the file before retrying. The repeated identical retry without re-reading also shows a lack of adaptive error handling."},

{id:"2-31",examId:2,domain:4,type:"mc",
question:"A team evaluates their documentation agent using: (1) Spell check accuracy, (2) Link validation, (3) Developer comprehension survey scores, (4) Time to find information. Which signals are quantitative and which are qualitative?",
options:[
"All four are quantitative",
"(1) and (2) are quantitative; (3) and (4) are qualitative",
"(1), (2), and (4) are quantitative; (3) is qualitative",
"(3) is qualitative; all others are quantitative"
],correct:2,
explanation:"Spell check accuracy (pass/fail counts), link validation (working/broken counts), and time-to-find-information (measurable in seconds) are all objectively measurable — quantitative. Developer comprehension survey scores involve subjective human judgment about whether the documentation is understandable — qualitative. Time is a measurement, even though it's user-facing."},

{id:"2-32",examId:2,domain:4,type:"ms",
question:"Select TWO effective strategies for tuning an agent that produces overly verbose code comments.",
options:[
"Add specific instructions in copilot-instructions.md: 'Write comments only to explain WHY, not WHAT. Omit comments when the code is self-explanatory.'",
"Reduce the model's context window size",
"Include examples of acceptable and unacceptable comment styles in the agent's instructions",
"Increase the model's temperature setting"
],correct:[0,2],
explanation:"Specific instructions with clear rules ('explain why, not what') and concrete examples of good vs. bad comments are the most effective tuning strategies. They give the agent unambiguous guidance it can follow. Context window size and temperature settings don't address the behavioral issue of comment verbosity."},

{id:"2-33",examId:2,domain:4,type:"mc",
question:"Why should failure analysis of agent tasks categorize root causes rather than just logging error messages?",
options:[
"Error messages are sufficient for debugging; categorization adds unnecessary complexity",
"Categorizing root causes (reasoning errors, tool misuse, context issues, environmental failures) enables systematic identification of patterns, targeted tuning, and prevention of recurring issues across similar tasks",
"Categorization is required by GitHub's terms of service",
"Categorization slows down the debugging process"
],correct:1,
explanation:"Root cause categorization enables systematic improvement. If most failures are context issues, the fix is better memory management. If most are tool misuse, the fix is better instructions or tool documentation. Without categorization, teams can't identify systemic patterns and end up fixing symptoms instead of root causes."},

{id:"2-34",examId:2,domain:4,type:"mc",
question:"An agent passes all unit tests but the code it generates consistently uses deprecated API methods. Which evaluation layer is missing?",
options:[
"Unit test coverage — more tests would catch the deprecated APIs",
"Static analysis — a linter or CodeQL rule checking for deprecated API usage is not included in the evaluation pipeline",
"Performance testing — deprecated APIs are slow",
"User acceptance testing — users should check for deprecated APIs"
],correct:1,
explanation:"Static analysis tools (linters, CodeQL custom rules) can detect deprecated API usage automatically. Unit tests verify behavior, not implementation quality. The missing evaluation layer is a static analysis check that flags deprecated method calls, which should be added to the CI pipeline as a required check."},

{id:"2-35",examId:2,domain:4,type:"mc",
question:"What does 'tuning through instruction revision' mean in the context of agentic AI systems?",
options:[
"Fine-tuning the underlying language model with new training data",
"Iteratively updating the agent's textual instructions (copilot-instructions.md) based on observed performance, failure analysis, and feedback to improve behavior without modifying the model",
"Changing the model version to a more capable one",
"Adjusting the model's API parameters like temperature and top-p"
],correct:1,
explanation:"Tuning through instruction revision is the practice of iteratively improving the agent's behavior by updating its instructions based on evidence. When the agent produces suboptimal results, you analyze why, update copilot-instructions.md with clarified rules or examples, and verify the improvement. This is the primary tuning mechanism available to most teams."},

// ── Domain 5: Multi-Agent Systems (10) ──
{id:"2-36",examId:2,domain:5,type:"scenario",
scenario:"A team has set up three agents: Agent A writes frontend code, Agent B writes backend API endpoints, and Agent C writes integration tests. They work on the same feature simultaneously. Agent A defines API request shapes based on its frontend needs. Agent B designs the API independently based on the spec document. Agent C writes integration tests that reference the endpoint signatures from Agent B's initial code.",
question:"What coordination problem is MOST likely to occur?",
options:[
"All three agents will produce identical code",
"Agent A's expected API shape and Agent B's actual API shape will diverge, and Agent C's tests will break when Agent B modifies its endpoints after Agent C has already written tests against the initial version",
"The agents will enter an infinite loop",
"Agent C will complete before Agents A and B"
],correct:1,
explanation:"This is a classic multi-agent coordination problem. Without a shared contract (API specification that all agents read and none unilaterally modify), Agent A and B can diverge in their API assumptions, and Agent C's tests become stale when Agent B iterates. The solution is to establish the API contract first and have all agents reference it."},

{id:"2-37",examId:2,domain:5,type:"mc",
question:"Which orchestration pattern would be MOST appropriate for a workflow that needs to simultaneously lint code, check for security vulnerabilities, and validate documentation — all independently?",
options:[
"Sequential orchestration",
"Hierarchical orchestration",
"Parallel orchestration",
"Fan-out/fan-in orchestration"
],correct:3,
explanation:"Fan-out/fan-in is the best pattern because the three tasks (lint, security scan, docs validation) are independent and can run concurrently. A coordinator fans them out to separate agents, and fans in their results when all complete. Pure parallel lacks the coordination aspect. Sequential would be unnecessarily slow since the tasks don't depend on each other."},

{id:"2-38",examId:2,domain:5,type:"mc",
question:"How should a hierarchical multi-agent system handle a situation where a subordinate agent fails repeatedly?",
options:[
"The supervisor agent should indefinitely retry the failed task",
"The supervisor should detect the repeated failure, attempt reassignment to a different agent or strategy, and escalate to human review if recovery is not possible",
"The entire hierarchy should shut down immediately",
"The failed agent should be allowed to continue indefinitely since it might eventually succeed"
],correct:1,
explanation:"In hierarchical orchestration, supervisors are responsible for monitoring subordinates, detecting failures, and implementing recovery strategies. This includes reassigning tasks to different agents, trying alternative approaches, and escalating to humans when automated recovery fails. Indefinite retries waste resources, full shutdowns are disproportionate, and hoping for success is not a strategy."},

{id:"2-39",examId:2,domain:5,type:"mc",
question:"When designing a multi-agent workflow, what is the PRIMARY benefit of defining clear agent boundaries?",
options:[
"It reduces the total number of API calls",
"It makes each agent independently testable, debuggable, and replaceable, and prevents unintended interactions between agents",
"It forces all agents to use the same programming language",
"It automatically synchronizes agent state"
],correct:1,
explanation:"Clear boundaries enable independent testing (each agent can be verified in isolation), debugging (failures can be attributed to specific agents), and replaceability (an agent can be swapped without affecting others). They also prevent interference where one agent's actions accidentally disrupt another's work. This is the key benefit of agent isolation."},

{id:"2-40",examId:2,domain:5,type:"ms",
question:"Select TWO valid strategies for preventing duplicated effort in a multi-agent system.",
options:[
"Use a shared task queue or work-tracking system that agents check before starting work",
"Give all agents identical instructions and hope they naturally avoid overlap",
"Implement a locking mechanism where an agent claims a task before beginning, preventing others from taking the same task",
"Run all agents on the same physical server"
],correct:[0,2],
explanation:"A shared task queue provides visibility into what work is in progress, and a locking mechanism ensures exclusive ownership of tasks. Both prevent the scenario where multiple agents unknowingly perform the same work. Identical instructions without coordination actually increase the chance of duplication, and server placement has no bearing on task coordination."},

{id:"2-41",examId:2,domain:5,type:"scenario",
scenario:"You are designing a multi-agent system for a CI/CD pipeline. The pipeline has these stages: (1) Code linting, (2) Unit tests, (3) Integration tests, (4) Security scanning, (5) Deployment to staging. Stages 1-2 can run independently. Stage 3 depends on stage 2. Stage 4 can run independently. Stage 5 depends on stages 3 and 4.",
question:"Which orchestration pattern BEST fits this workflow?",
options:[
"Strictly sequential: 1 then 2 then 3 then 4 then 5",
"Fully parallel: all 5 stages run simultaneously",
"Hybrid: fan-out stages 1, 2, and 4 in parallel; stage 3 after 2 completes; stage 5 after 3 and 4 complete (fan-in at 5)",
"Hierarchical: a supervisor agent decides the order at runtime"
],correct:2,
explanation:"The dependency graph requires a hybrid approach. Stages 1, 2, and 4 have no dependencies on each other (fan-out parallel). Stage 3 must wait for stage 2 (sequential dependency). Stage 5 requires both 3 and 4 to complete (fan-in synchronization point). This maximizes parallelism while respecting dependencies."},

{id:"2-42",examId:2,domain:5,type:"mc",
question:"What is the role of a 'coordinator' agent in a multi-agent orchestration?",
options:[
"The coordinator performs all the actual work while other agents observe",
"The coordinator distributes tasks, monitors progress, handles inter-agent communication, aggregates results, and manages failure recovery",
"The coordinator only handles logging and monitoring",
"The coordinator is optional and has no impact on system reliability"
],correct:1,
explanation:"The coordinator is the orchestration brain: it breaks down tasks, assigns them to appropriate agents, monitors execution progress, facilitates communication between agents, aggregates results from completed sub-tasks, and handles recovery when agents fail. Without a coordinator, multi-agent systems lack the oversight needed for reliable operation."},

{id:"2-43",examId:2,domain:5,type:"mc",
question:"An agent is being retired from a multi-agent system. What step is MOST important to ensure before decommissioning?",
options:[
"Delete all of the agent's logs to free up storage",
"Preserve the agent's audit trail, verify no active tasks depend on it, and update the system configuration to remove its entry points",
"Immediately terminate the agent without notice",
"Transfer the agent's permissions to another agent"
],correct:1,
explanation:"Before retiring an agent, three things must happen: preserve its audit trail for compliance and debugging history, verify no active tasks or other agents depend on it (to prevent cascading failures), and cleanly update the system configuration to remove its triggers and entry points. Deleting logs destroys accountability, and immediate termination risks in-flight task corruption."},

{id:"2-44",examId:2,domain:5,type:"mc",
question:"In a multi-agent system, what is a 'contradictory output' conflict?",
options:[
"Two agents produce code that fails to compile",
"Two agents produce valid but mutually incompatible results for related sub-tasks, such as different API endpoint designs that serve the same client",
"Two agents run at the same time",
"Two agents use different programming languages"
],correct:1,
explanation:"Contradictory outputs occur when agents produce individually valid results that are incompatible with each other. For example, one agent designs a REST API while another designs a GraphQL API for the same data — both are valid, but the system can't use both simultaneously. Detection requires comparing agent outputs for mutual consistency."},

{id:"2-45",examId:2,domain:5,type:"mc",
question:"When debugging a failure in a multi-agent system, why is it important to examine the interactions between agents rather than just each agent's individual logs?",
options:[
"Individual logs are usually empty in multi-agent systems",
"Failures often originate in the communication between agents — incorrect data passed, timing mismatches, or violated assumptions — which only becomes visible when viewing the full interaction trace across agents",
"Examining interactions is unnecessary; each agent's individual logs are always sufficient",
"Interactions are only relevant for systems with more than 10 agents"
],correct:1,
explanation:"Many multi-agent failures are emergent — they arise from the interaction between agents rather than from any single agent's malfunction. Agent A might produce correct output that Agent B misinterprets, or timing issues might cause Agent C to act on stale data from Agent D. Only cross-agent interaction traces reveal these patterns."},

// ── Domain 6: Guardrails & Safety (7) ──
{id:"2-46",examId:2,domain:6,type:"scenario",
scenario:"Your organization is implementing AI agents across 15 development teams. Some teams work on public-facing consumer applications, some on internal tools, and some on regulated financial services. The CISO wants a unified guardrail policy.",
question:"What approach BEST balances uniform governance with team-specific needs?",
options:[
"Apply the strictest guardrails from the financial services team to all 15 teams",
"Define a baseline policy with organization-wide required checks (secret scanning, branch protection), then allow team-specific overlays that can add stricter controls (additional CODEOWNERS, required reviews) based on their risk profile",
"Let each team define its own policies independently",
"Apply no guardrails since they slow down development"
],correct:1,
explanation:"A tiered approach with a mandatory baseline plus team-specific overlays balances governance with flexibility. All teams get the essential guardrails (secret scanning, branch protection), while regulated teams can add stricter controls. This avoids over-constraining low-risk teams while ensuring high-risk teams meet compliance requirements."},

{id:"2-47",examId:2,domain:6,type:"ordering",
question:"Arrange these branch protection configurations from LEAST restrictive to MOST restrictive.",
options:[
"Require 2 reviews including CODEOWNERS, require status checks to pass, require signed commits, and restrict who can push",
"Require 1 approving review before merge",
"No branch protection configured",
"Require 1 review plus passing status checks, enable CODEOWNERS"
],correct:[2,1,3,0],
explanation:"No protection is the least restrictive. Single review adds minimal human oversight. Adding status checks and CODEOWNERS increases scrutiny by requiring automated validation and specific reviewer approval. The most restrictive adds multiple reviews, signed commits, and push restrictions, creating maximum governance."},

{id:"2-48",examId:2,domain:6,type:"mc",
question:"A CODEOWNERS file contains: '*.sql @database-team'. What guardrail does this create for an AI agent?",
options:[
"The agent cannot read SQL files",
"Any PR the agent creates that modifies SQL files will automatically require review from the database-team before it can be merged",
"The agent must be a member of the database-team to modify SQL files",
"SQL files are automatically excluded from the agent's context"
],correct:1,
explanation:"CODEOWNERS creates a review requirement: PRs that modify matching file patterns automatically add the specified team as required reviewers. The agent can still modify SQL files and create PRs, but those PRs cannot merge without database-team approval. This ensures domain experts review changes in their area of ownership."},

{id:"2-49",examId:2,domain:6,type:"mc",
question:"What is a 'required check' in the context of GitHub branch protection, and how does it serve as an agent guardrail?",
options:[
"A required check is a CI job that must pass before a PR can merge; for agents, it ensures their changes meet quality gates regardless of who created the PR",
"A required check is a manual review step that only applies to human contributors",
"A required check automatically fixes failing code before merge",
"A required check is a GitHub feature that counts the number of commits in a PR"
],correct:0,
explanation:"Required checks are CI/CD jobs (linting, tests, security scans) that must pass before a PR can merge. They apply uniformly to all PRs — whether created by humans or agents. This ensures agent-generated code meets the same automated quality gates as human-written code, preventing regressions from reaching the protected branch."},

{id:"2-50",examId:2,domain:6,type:"mc",
question:"An AI agent accidentally commits a file containing a database connection string. Which native GitHub feature would detect this?",
options:[
"Dependabot",
"CodeQL",
"Secret scanning",
"GitHub Actions"
],correct:2,
explanation:"Secret scanning detects credentials, tokens, API keys, and connection strings that are accidentally committed to repositories. It scans pushes and repository history for patterns matching known secret formats. Dependabot handles dependency vulnerabilities, CodeQL handles code vulnerabilities, and GitHub Actions is a CI/CD platform."},

{id:"2-51",examId:2,domain:6,type:"ms",
question:"Select TWO valid reasons for implementing human-in-the-loop controls for an agent that deploys to production.",
options:[
"To slow down the deployment process for its own sake",
"To ensure a human verifies the deployment plan before irreversible changes are applied to production infrastructure",
"To satisfy change management compliance requirements that mandate documented human approval",
"To reduce the agent's API token consumption"
],correct:[1,2],
explanation:"Human verification before irreversible production changes prevents catastrophic errors, and compliance requirements (SOC 2, PCI-DSS, HIPAA) often mandate documented human approval for production changes. Slowing down for its own sake is not a valid reason, and human-in-the-loop doesn't meaningfully affect token consumption."},

{id:"2-52",examId:2,domain:6,type:"mc",
question:"How does the principle of 'defense in depth' apply to agent guardrails?",
options:[
"Use a single, very strict guardrail to prevent all possible issues",
"Layer multiple independent guardrails (permissions, branch protection, required checks, CODEOWNERS, secret scanning) so that if one fails, others still provide protection",
"Only apply guardrails at the point of deployment, not during development",
"Defense in depth is a network security concept that doesn't apply to agent guardrails"
],correct:1,
explanation:"Defense in depth means no single guardrail is solely responsible for safety. Permissions limit what agents can do, branch protection controls what reaches production, required checks enforce quality gates, CODEOWNERS routes reviews to experts, and secret scanning catches leaked credentials. If one layer is bypassed or fails, the others still provide protection."},
